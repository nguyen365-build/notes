rofile.)"], "src": "D"}, {"n": 108, "u": "4", "s": "4.2 User Support", "q": "Outline two problems associated with knowledge representation and modeling in adaptive help systems. (pp. 410 to 411 of HCI)", "k": ["adaptive help systems", "help", "knowledge representation", "privacy", "users"], "a": ["<b>Knowledge acquisition<\/b>: building accurate user, task and domain knowledge is time-consuming and difficult; user knowledge is the hardest because the user's thinking is not visible.", "<b>Interpretation and control<\/b>: the system must infer intentions from actions, which is unreliable, and adapting wrongly or without user control is confusing (and raises privacy concerns about monitoring)."], "src": "D"}, {"n": 109, "u": "4", "s": "4.2 User Support", "q": "What are two questions that must be addressed in the presentation of help? (p. 412 of HCI)", "k": ["help", "presentation of help"], "a": ["How is help <b>requested<\/b>? (command, function key, help button, separate application, automatic)", "How is help <b>displayed<\/b>? (new window, whole screen, part of screen, pop-up, tooltip) and what is its content and style."], "src": "D"}, {"n": 110, "u": "4", "s": "4.2 Ex 11.2", "q": "Ex 11.2: Find an application you have never used. Learn it using only the online support. Is there enough information? Is it easy to find? What improvements would you suggest?", "k": ["completeness", "consistency", "dialog", "flexibility", "help", "materials", "online support", "robustness"], "a": ["Make a task list from basic to complex; note prior knowledge used.", "Assess against the six requirements: availability, accuracy and completeness, consistency, robustness, flexibility, unobtrusiveness.", "Typical findings: search finds reference material but not task how-tos; jargon in help; help out of date; no context-sensitive help in dialogs.", "Suggest: task-based articles, tooltips, examples, better search. No model answer published."], "src": "O"}, {"n": 111, "u": "4", "s": "4.2 Ex 11.3", "q": "Ex 11.3: What knowledge is needed to build an adaptive help system? Which do you think is most difficult to provide and why?", "k": ["adaptive help system", "help", "users"], "a": ["Needed: domain knowledge and user knowledge at least; may also need task knowledge and teaching (advisory) strategies.", "Hardest: user knowledge (and task knowledge); thoughts are not visible, so monitoring only gives coarse measures like counts of successful actions or frequency of use.", "Context can be inferred from activity only if the tool reveals it.", "Domain knowledge is probably easiest (from the system or designer), though time-consuming."], "src": "W"}, {"n": 112, "u": "4", "s": "4.2 Ex 11.4", "q": "Ex 11.4: Look at as many online support systems as you can. Which do you find most useful and why? Assess them using the requirements in Section 11.2.", "k": ["help", "hypertext", "novice", "online support systems"], "a": ["Use the Section 11.2 requirements as the scoring frame (perhaps 1 to 5 each).", "Compare context-sensitive help (tooltips, field help), application help centres (hypertext), manual style help (UNIX man), prompt-based help, wizards, community forums.", "Usually most useful: context-sensitive and task-based searchable help; least: man pages for novices.", "Open investigation on site."], "src": "O"}, {"n": 113, "u": "5", "s": "5.1 Cognitive Models", "q": "What is the difference between a competence and a performance model? (p. 420 of HCI)", "k": ["BNF", "competence", "experts", "GOMS", "KLM", "performance", "performance model", "TAG", "users"], "a": ["<b>Competence models<\/b> describe what behaviour sequences are legal and what the user must know (e.g. BNF, TAG); they say nothing about time or errors.", "<b>Performance models<\/b> predict how the user will actually behave and how long tasks take (e.g. GOMS, KLM), usually for expert error-free use."], "src": "D"}, {"n": 114, "u": "5", "s": "5.1 Cognitive Models", "q": "What are the four elements of GOMS? (pp. 422 to 423 of HCI)", "k": ["four elements of GOMS", "GOMS", "menus", "users"], "a": ["<b>Goals<\/b>: what the user wants to achieve.", "<b>Operators<\/b>: basic actions (perceptual, motor, cognitive).", "<b>Methods<\/b>: sequences of subgoals and operators that achieve a goal.", "<b>Selection rules<\/b>: choose between alternative methods (e.g. IF hand on mouse THEN use menu)."], "src": "D"}, {"n": 115, "u": "5", "s": "5.1 Cognitive Models", "q": "Give an example of how TAG can handle consistency in a way BNF cannot. (pp. 432 to 434 of HCI)", "k": ["BNF", "consistency", "grammars", "patterns", "semantic", "TAG"], "a": ["Commands: copy src dest, move src dest, delete file.", "BNF writes a separate rule for each command, so it cannot show that copy and move share the same structure; a consistent and an inconsistent language can have the same number of BNF rules.", "TAG (task-action grammar) uses parameterised rules with semantic features: one rule 'file-op[Op] := command[Op] + filename + filename' covers copy and move.", "If one command breaks the pattern (e.g. move dest src), TAG needs extra rules, revealing the inconsistency."], "src": "D"}, {"n": 116, "u": "5", "s": "5.1 Cognitive Models", "q": "What are the two weaknesses of grammars in modeling for users of a display-based system? (pp. 434 to 435 of HCI)", "k": ["display-based system", "displays", "grammars", "two weaknesses", "users"], "a": ["They model what the user knows in the head and ignore how users read the display: in display-based systems users rely on what they see (knowledge in the world) rather than planning the whole command.", "They describe the input language but not the system's output or feedback, so they cannot capture the interaction loop."], "src": "D"}, {"n": 117, "u": "5", "s": "5.1 Cognitive Models", "q": "What are the operators of the keystroke-level model (KLM)? (pp. 436 to 438 of HCI)", "k": ["keystroke", "keystroke-level model", "KLM"], "a": ["Physical motor: <b>K<\/b> keystroke (0.08 to 1.2 s, 0.28 average), <b>B<\/b> mouse button press (0.1 s, click = 0.2), <b>P<\/b> point with mouse (1.1 s), <b>H<\/b> home hands between devices (0.4 s), <b>D<\/b> draw lines.", "Mental: <b>M<\/b> mental preparation (1.35 s).", "System: <b>R<\/b> system response time."], "src": "D"}, {"n": 118, "u": "5", "s": "5.1 Cognitive Models", "q": "What are the four different activities that occur within a problem space? (pp. 444 to 445 of HCI)", "k": ["cognitive models", "four different activities", "problem space", "reasoning"], "a": ["Following Newell's problem space model: <b>goal formulation<\/b>, <b>operator selection<\/b>, <b>operator application<\/b>, <b>goal completion<\/b>.", "A problem space is a set of states plus operators that move between states; the problem is solved by applying operators until the goal state is reached. [Verify the four labels on pp. 444 to 445.]"], "src": "D"}, {"n": 119, "u": "5", "s": "5.1 Ex 12.1", "q": "Ex 12.1: Rewrite the expert CCT rule INSERT-SPACE-2 (keystrokes I, SPACE, ESC proceduralised) as 'novice' rules, with separate rules for each keystroke and suitable goals such as GET-INTO-INSERT-MODE.", "k": ["CCT", "CCT rule", "experts", "GET-INTO-INSERT-MODE", "INSERT-SPACE-2", "keystroke", "novice", "novice rules"], "a": ["INSERT-SPACE-BEGIN-SET-MODE: IF goal insert space AND cursor tested AND note 'in command mode' THEN add goal get-into-insert-mode.", "INSERT-SPACE-END-SET-MODE: IF goals insert space AND get-into-insert-mode THEN press I, add note 'in insert mode', delete goal get-into-insert-mode.", "INSERT-SPACE-DOIT: IF goal insert space AND note 'in insert mode' AND cursor position THEN press SPACE, add goal get-into-command-mode.", "INSERT-SPACE-CLEAN-UP: IF goals insert space AND get-into-command-mode AND note 'in insert mode' THEN press ESC, delete the goals and the note, add note 'in command mode'."], "src": "W"}, {"n": 120, "u": "5", "s": "5.1 Ex 12.2", "q": "Ex 12.2: Choose a common task with a familiar system (e.g. a column of numbers and its sum in a spreadsheet) and describe the user's algorithm in pseudocode (programmable user model approach). Does it suggest improvements?", "k": ["A1", "common task", "programmable user model", "pseudocode", "spreadsheet", "users"], "a": ["Pseudocode: select cell A1; for each number: type number; press Enter (moves down); end; select cell below the last; type '=SUM(' ; drag from A1 to last cell; type ')' ; press Enter; read result.", "Hidden knowledge revealed: that Enter moves down, the SUM syntax, how to select a range.", "Improvements suggested: an AutoSum button that guesses the range, a visible formula preview, a status-bar sum on selection (which spreadsheets now provide). Open-ended on site."], "src": "O"}, {"n": 121, "u": "5", "s": "5.2 Socio-organizational Issues", "q": "What is the free rider problem and how might we solve it? (pp. 454 to 455 of HCI)", "k": ["free rider problem", "users"], "a": ["In shared systems some people get the benefit without contributing (read the forum or shared calendar but never post), so contributions dry up and the system fails.", "Solutions: strong social or management norms; make each person's contribution visible; reduce the cost of contributing; give contributors direct benefit; reach a critical mass of users quickly."], "src": "D"}, {"n": 122, "u": "5", "s": "5.2 Socio-organizational Issues", "q": "Who are the four stakeholders in the CUSTOM model? (pp. 458 to 459 of HCI)", "k": ["CUSTOM", "CUSTOM model", "design", "four stakeholders", "stakeholders"], "a": ["<b>Primary<\/b>: people who actually use the system.", "<b>Secondary<\/b>: receive output or provide input but do not use it directly.", "<b>Tertiary<\/b>: not in the first two groups but directly affected by its success or failure.", "<b>Facilitating<\/b>: involved in its design, development and maintenance."], "src": "D"}, {"n": 123, "u": "5", "s": "5.2 Socio-organizational Issues", "q": "How is success defined by soft systems methodology? (p. 466 of HCI)", "k": ["CATWOE", "soft systems methodology", "stakeholders", "transformations"], "a": ["SSM does not look for one technically correct solution; it seeks understanding of the whole problem situation from multiple viewpoints.", "Success is reaching changes that are both <b>desirable<\/b> and <b>feasible<\/b>, agreed by the stakeholders: an improved situation and shared understanding rather than a specified product.", "(Uses rich pictures and the CATWOE root definition: Clients, Actors, Transformation, Weltanschauung, Owner, Environment.)"], "src": "D"}, {"n": 124, "u": "5", "s": "5.2 Socio-organizational Issues", "q": "What are four methods of participatory design? (pp. 466 to 467 of HCI)", "k": ["design", "ethics", "four methods of participatory design", "participatory design", "users"], "a": ["<b>Brainstorming<\/b>: group generation of ideas without criticism.", "<b>Storyboarding<\/b>: sketches of a sequence of use.", "<b>Workshops<\/b>: designers and users share knowledge and expectations.", "<b>Pencil-and-paper exercises<\/b>: users walk through paper mock-ups.", "(ETHICS by Mumford is a participatory method too.)"], "src": "D"}, {"n": 125, "u": "5", "s": "5.2 Socio-organizational Issues", "q": "Briefly describe the five models of contextual inquiry. (pp. 471 to 472 of HCI)", "k": ["contextual inquiry", "five models of contextual inquiry", "layout"], "a": ["From Beyer and Holtzblatt:", "<b>Flow model<\/b>: communication and coordination between people.", "<b>Sequence model<\/b>: the steps taken to achieve an intention.", "<b>Artifact model<\/b>: the physical or electronic things used and created in the work.", "<b>Cultural model<\/b>: the norms, expectations and values that shape the work.", "<b>Physical model<\/b>: the layout of the workplace."], "src": "D"}, {"n": 126, "u": "5", "s": "5.2 Ex 13.1", "q": "Ex 13.1: A group of universities builds a free CD-ROM information system to help potential students find courses (contents, requirements, facilities, fees, admissions). Identify, categorize and describe the main stakeholders using CUSTOM.", "k": ["CD-ROM information system", "CUSTOM", "help", "potential students", "satisfaction", "stakeholders"], "a": ["Primary: potential students; careers officers.", "Secondary: university admissions staff; schools liaison officers.", "Tertiary: students' families; local businesses; lecturers on specific courses.", "Facilitating: CD designers; university funding authorities.", "CUSTOM description per stakeholder (e.g. careers officer): success measures, satisfaction, knowledge of admissions (UCAS), works alone, task list, confidentiality, office environment; proposed system takes over course research."], "src": "W"}, {"n": 127, "u": "5", "s": "5.2 Ex 13.2", "q": "Ex 13.2: For the same scenario: produce a rich picture; a CATWOE root definition from the university's viewpoint; and the transformations needed to support it.", "k": ["CATWOE", "CATWOE root definition", "motivation", "rich picture", "scenario", "transformations"], "a": ["Rich picture: all actors from 13.1, their relationships and motivations (university wants students and funds; students want location, quality, value, closeness to family).", "Root definition: a system owned by university management, operated by careers staff and students in careers offices and schools, within UCAS rules and competition, to sell courses, generate income and meet a need for learning.", "CATWOE: C = student; A = careers staff and students; T = intention to go to university becomes place offered and income; W = more students raise income and effectiveness; O = university management; E = UCAS and university rules, competition.", "Transformations: need for course information to need met; need for funding to funding generated; need for learning provision to need met."], "src": "W"}, {"n": 128, "u": "6", "s": "6.1 Analyzing Tasks", "q": "What are knowledge-based techniques, task decomposition, and entity-relationship-based analysis? (p. 511 of HCI)", "k": ["entity-relationship-based analysis", "HTA", "knowledge-based techniques", "TAKD", "task decomposition", "users"], "a": ["<b>Task decomposition<\/b>: split a task into subtasks and the order they are done in (e.g. HTA).", "<b>Knowledge-based techniques<\/b>: what users need to know about the objects and actions in a task and how that knowledge is organised (taxonomies, TAKD).", "<b>Entity-relationship-based analysis<\/b>: an object-based approach stressing actors, objects and the actions and relationships among them."], "src": "D"}, {"n": 129, "u": "6", "s": "6.1 Analyzing Tasks", "q": "Where does task analysis occur in the software design life cycle? (p. 512 of HCI)", "k": ["design", "dialog", "evaluation", "menus", "software design life cycle", "task analysis"], "a": ["Mainly early, in requirements capture: understanding the current work before design.", "Its results feed into design (menus, dialog order), manuals and tutorials, and evaluation tasks, so it influences several later stages."], "src": "D"}, {"n": 130, "u": "6", "s": "6.1 Analyzing Tasks", "q": "What are seven types of plans outlined in your text in relationship to task decomposition? (pp. 517 to 518 of HCI)", "k": ["plans", "seven types of plans", "task decomposition", "users"], "a": ["1 <b>Fixed sequence<\/b>.", "2 <b>Optional tasks<\/b> (do if needed).", "3 <b>Wait for events<\/b>.", "4 <b>Cycles<\/b> (repeat until).", "5 <b>Time-sharing<\/b> (concurrent).", "6 <b>Discretionary<\/b> (any order, user's choice).", "7 <b>Mixtures<\/b> of the above."], "src": "D"}, {"n": 131, "u": "6", "s": "6.1 Analyzing Tasks", "q": "Explain the use of XOR, AND, and OR in the TAKD method. (pp. 521 to 523 of HCI)", "k": ["hierarchy", "TAKD", "TAKD method", "XOR"], "a": ["In the task descriptive hierarchy (TDH) of TAKD, branches below a node are labelled:", "<b>XOR<\/b>: exactly one branch applies (an object is one of these, e.g. a pen is either marker or pencil).", "<b>AND<\/b>: all branches apply together (an object has all these attributes).", "<b>OR<\/b>: one or more branches may apply."], "src": "D"}, {"n": 132, "u": "6", "s": "6.1 Analyzing Tasks", "q": "What are the three relationships in ER-based techniques? (pp. 528 to 529 of HCI)", "k": ["ER analysis", "ER-based techniques", "task analysis", "three relationships"], "a": ["Actors <b>perform<\/b> actions (agent relationship: who does it).", "Actions act on objects (the object as <b>patient<\/b> or as <b>instrument<\/b> of an action).", "Objects relate to other objects (e.g. <b>location<\/b>, part-of / composition).", "[Grouping inferred from Dix 15.4; check exact labels on pp. 528 to 529.]"], "src": "D"}, {"n": 133, "u": "6", "s": "6.1 Analyzing Tasks", "q": "What are three common sources of information? (pp. 532 to 538 of HCI)", "k": ["documentation", "ethnography", "experts", "observation", "questionnaire", "sources of information", "three common sources of information", "users"], "a": ["<b>Documentation<\/b>: manuals, procedures, existing system documents (beware: they show official, not actual, practice).", "<b>Observation<\/b>: watching users in context, including ethnography and think-aloud.", "<b>Interviews<\/b>: with users and domain experts (also questionnaires)."], "src": "D"}, {"n": 134, "u": "6", "s": "6.1 Analyzing Tasks", "q": "How can task analysis be used in the detailed design of interfaces? (pp. 540 to 541 of HCI)", "k": ["design", "detailed design", "dialog", "evaluation", "help", "HTA", "menus", "plans", "scenario", "task analysis", "users"], "a": ["Taxonomies of objects and actions suggest menu groupings and labels in the users' own vocabulary.", "Task order from HTA plans suggests the order of screens and dialog flow, and which actions should be close together.", "Frequent tasks get shortcuts; the task model identifies required information at each step.", "It also drives manuals, help and evaluation scenarios."], "src": "D"}, {"n": 135, "u": "6", "s": "6.1 Ex 15.2", "q": "Ex 15.2: Complete the tea-making manual in Figure 15.7. Do you think it would be useful? When would such a procedural manual help, and when would a conceptual manual be better?", "k": ["conceptual manual", "help", "novice", "procedural manual", "safety-critical", "tea-making manual", "users"], "a": ["Useful for: the absolute novice with no background; rarely done tasks (installing equipment); safety-critical drills (emergency procedures); time-critical rote tasks (telephony); users following steps without needing understanding.", "Drawbacks: gives no sense of why; fails in new situations (a broken kettle) where users must reason from the goal (heat water) to a substitute (microwave), which needs a conceptual manual."], "src": "W"}, {"n": 136, "u": "6", "s": "6.1 Ex 15.3", "q": "Ex 15.3: Figure 15.1 shows a textual HTA of vacuum cleaning. Present the same information diagrammatically.", "k": ["HTA", "plans", "textual HTA", "vacuum cleaning"], "a": ["Top box: 0. clean the house. Below it boxes 1 get vacuum cleaner out; 2 fix appropriate attachment; 3 clean the rooms; 4 empty dust bag; 5 put vacuum cleaner and attachments away.", "Under 3: 3.1 clean the hall; 3.2 clean the living rooms; 3.3 clean the bedrooms.", "Write plans beside each parent line: Plan 0: do 1, 2, 3, 5 in that order; when dust bag full do 4. Plan 3 (revised): do any of 3.1, 3.2, 3.3 in any order depending on which rooms need cleaning.", "Model answer on site is a diagram image only."], "src": "W"}, {"n": 137, "u": "6", "s": "6.1 Ex 15.4", "q": "Ex 15.4: Figure 15.6 uses an HTA diagram for a tractor's actions; show the same information textually.", "k": ["HTA", "HTA diagram", "plans"], "a": ["0. life cycle of tractor", "1. maintenance", "2. cultivation: 2.1 connect implement (2.1.1 fix harrow; 2.1.2 fix plough); 2.2 drive to field; 2.3 cultivate field; 2.4 drive to shed; 2.5 put away", "Plan 0: as required do 2; when tractor breaks down do 1.", "Plan 2: 2.1 then 2.2 then 2.3 then 2.4 then 2.5.", "Plan 2.1: one of 2.1.1 or 2.1.2 depending on the job."], "src": "W"}, {"n": 138, "u": "6", "s": "6.1 Ex 15.5", "q": "Ex 15.5: Observe an office, note the actions performed and objects used; use different recording techniques (Chapter 9). Then use the different task analysis techniques to structure your findings.", "k": ["experts", "HTA", "observation", "recording techniques", "task analysis techniques", "video"], "a": ["List objects (desk diary, telephone, filing cabinet, computer) for a knowledge-based or ER description.", "List actors (secretary, lecturer, student, administrator); note that roles shift.", "Build activity lists from observation, then structure them hierarchically into an HTA.", "Supplement with interviews of a domain expert or video.", "Assess the quality of observation via intermediate notes as well as the final analysis."], "src": "W"}, {"n": 139, "u": "6", "s": "6.2 Dialog Notations and Design", "q": "How are the three levels of computer language relevant to dialog? (p. 545 of HCI)", "k": ["design", "dialog", "lexical", "semantic", "sound", "syntactic", "three levels of computer language"], "a": ["<b>Lexical<\/b>: the shape of icons, actual keys pressed, sounds.", "<b>Syntactic<\/b>: the order and structure of inputs and outputs.", "<b>Semantic<\/b>: the effect on the internal application data and meaning.", "Dialog design and dialog notations deal mainly with the <b>syntactic<\/b> level, linking to lexical and semantic levels."], "src": "D"}, {"n": 140, "u": "6", "s": "6.2 Dialog Notations and Design", "q": "What are three reasons for using a separate dialog description notation? (pp. 547 to 548 of HCI)", "k": ["completeness", "consistency", "dialog", "dialog description notation", "prototyping", "reachability", "separate dialog description notation"], "a": ["<b>Analysis<\/b>: the dialog can be checked for properties (completeness, consistency, reachability, dangerous states) before building.", "<b>Separation of concerns<\/b>: dialog is kept apart from presentation and application code, so each can change independently.", "<b>Communication and prototyping<\/b>: designers and implementers share a precise description and dialogs can be prototyped early."], "src": "D"}, {"n": 141, "u": "6", "s": "6.2 Dialog Notations and Design", "q": "What is the basic difference between flowcharts and state transition networks (STNs)? (pp. 559 to 561 of HCI)", "k": ["dialog", "flowcharts", "state transition networks", "STN", "STNs", "users"], "a": ["In a flowchart the boxes are processes (what the program does) and arrows show control flow.", "In an STN the circles are dialog <b>states<\/b> where the system waits for user input, and arcs are user actions with system responses.", "Flowcharts describe the program; STNs describe the dialog from the user's side."], "src": "D"}, {"n": 142, "u": "6", "s": "6.2 Dialog Notations and Design", "q": "How can state-oriented production rules be differentiated from event-oriented production rules? (p. 568 of HCI)", "k": ["dialog", "event-oriented production rules", "memory", "production rules", "state-oriented production rules", "users"], "a": ["<b>Event-oriented<\/b> rules fire when an event arrives (user, internal or system events) and may generate new events; good for event-driven sequential dialog.", "<b>State-oriented<\/b> rules fire on the current state, a set of persistent conditions (memory), and change that state; good for concurrent dialog, e.g. modifier keys held down.", "Event-oriented rules need explicit bookkeeping to represent states; state-oriented rules are awkward for events."], "src": "D"}, {"n": 143, "u": "6", "s": "6.2 Dialog Notations and Design", "q": "What are three approaches to linking dialog and semantics? (p. 574 of HCI)", "k": ["dialog", "linking dialog and semantics", "semantic", "STN"], "a": ["1 <b>Notation-specific semantics<\/b>: actions written within the dialog notation itself (e.g. annotations on STN arcs).", "2 <b>Links to a programming language<\/b>: dialog calls application code (callbacks).", "3 <b>Links to a formal specification notation<\/b>: dialog connected to a formal model of the application.", "[Grouping from Dix 16.4; confirm labels on p. 574.]"], "src": "D"}, {"n": 144, "u": "6", "s": "6.2 Dialog Notations and Design", "q": "What is the proper relationship between states and connectivity? (p. 584 of HCI)", "k": ["connectivity", "reachability", "reversibility", "states and connectivity", "users"], "a": ["<b>Reachability<\/b>: every state should be reachable from every other state (no unreachable states or dead ends).", "<b>Reversibility<\/b>: the user should be able to get back to the previous state, ideally in one step.", "Dangerous states should be hard to reach accidentally and easy to leave."], "src": "D"}, {"n": 145, "u": "6", "s": "6.2 Ex 16.1", "q": "Ex 16.1: Complete the drawing tool STN (Figures 16.1, 16.3) for the text submenu (centred, left, right justified; click a location then type) and the paint submenu (pencil: hold mouse button while moving; paint pot: click to fill).", "k": ["drawing tool STN", "menus", "paint pot", "paint submenu", "STN", "text submenu"], "a": ["Text submenu STN: menu state -> select justification (centred/left/right) -> wait-for-click state -> click on drawing surface -> typing state -> type line (single action) -> back to menu.", "Character by character: typing state loops on each character typed; Enter ends the loop.", "Paint submenu: menu -> pencil: press mouse button -> drawing state (loop on mouse move) -> release button -> back; paint pot: click on area -> fill -> back.", "Pencil uses press and release, not click."], "src": "W"}, {"n": 146, "u": "6", "s": "6.2 Ex 16.2", "q": "Ex 16.2: Repeat 16.1 using different notations (grammars, production rules, JSD or CSP), specifying the whole system from main menu to submenu selections. Note problems with each notation.", "k": ["BNF", "CSP", "dialog", "different notations", "grammars", "help", "JSD", "menus", "production rules", "users"], "a": ["BNF: straightforward but tedious; named subdialogs help, too many levels confuse; cannot tell a menu click from a click on the drawing surface (both position + click); UAN distinguishes them.", "Production rules: hard to track how deep the user is in the menu stack; higher-level options stay active during lower dialogs (stray clicks); fix with clean-up rules and activity events such as main-active, graphics-active."], "src": "W"}, {"n": 147, "u": "6", "s": "6.2 Ex 16.3", "q": "Ex 16.3: Develop the JSD diagram in Figure 16.14 down to basic operations such as 'prompt login' or 'user types password'. Expand 'delete employee' using the dialog style of Figure 16.13.", "k": ["basic operations", "delete employee", "dialog", "dialog style", "JSD", "JSD diagram", "prompt login", "users"], "a": ["Expand login into prompt login, user types name, prompt password, user types password (assumes correct password).", "Wrong passwords are hard: JSD does not separate user choice from system choice, and wrapping the rest in an option box hides structure.", "Change and delete subdialogs wrap the file update in an optional box, since the user may answer N to confirmation.", "Advice: model the normal case first; add error handling later or annotate it."], "src": "W"}, {"n": 148, "u": "6", "s": "6.2 Ex 16.4", "q": "Ex 16.4: For the digital watch (Section 16.3.8), what are the dangerous states? Relate the lexical issues of the buttons to them and give design advice. Does your watch satisfy these criteria?", "k": ["dangerous states", "design", "design advice", "digital watch", "lexical", "lexical issues", "reversibility"], "a": ["Dangerous states: time-setting and alarm-setting modes, which should not be entered by accident.", "Guard entry: e.g. hold button A for two seconds; or recessed buttons needing a pencil; or holding a button while changing.", "Guarding the mode is better than guarding change buttons, which makes legitimate changes hard.", "Reversibility: often no way to move the time back, so one extra press can need 59 more to undo; add a decrement button."], "src": "W"}, {"n": 149, "u": "7", "s": "7.1 Groupware and CSCW", "q": "How is CSCW related to HCI? (pp. 663 to 664 of HCI)", "k": ["awareness", "CSCW", "groupware", "users"], "a": ["HCI traditionally studies one user and one computer; CSCW extends it to groups of people working together through computers.", "It adds social and organisational issues: communication, coordination, awareness, shared artifacts. Groupware is the software that supports CSCW."], "src": "D"}, {"n": 150, "u": "7", "s": "7.1 Groupware and CSCW", "q": "What are three types of groupware classified by function? (p. 667 of HCI)", "k": ["groupware", "three types of groupware", "video"], "a": ["<b>Computer-mediated communication<\/b>: email, conferencing, video.", "<b>Meeting and decision support systems<\/b>: argumentation tools, meeting rooms, shared drawing surfaces.", "<b>Shared applications and artifacts<\/b>: shared editors, shared PCs and windows, shared diaries, communication through the artifact."], "src": "D"}, {"n": 151, "u": "7", "s": "7.1 Groupware and CSCW", "q": "What differentiates CMC from CSCW? (p. 667 of HCI)", "k": ["CMC", "CSCW", "video"], "a": ["CMC (computer-mediated communication) supports direct communication between participants (email, chat, video conferencing).", "CSCW is the wider field covering all computer support for cooperative work, including coordination and shared work artifacts; CMC is one category within it."], "src": "D"}, {"n": 152, "u": "7", "s": "7.1 Groupware and CSCW", "q": "What are three types of meeting and decision support tools? (p. 679 of HCI)", "k": ["decision support", "design", "meeting and decision support tools"], "a": ["<b>Argumentation tools<\/b>: record arguments and design rationale (e.g. gIBIS).", "<b>Meeting rooms<\/b>: electronic meeting rooms with networked workstations and a shared public screen.", "<b>Shared work surfaces<\/b>: shared drawing or whiteboard spaces for distributed groups."], "src": "D"}, {"n": 153, "u": "7", "s": "7.1 Groupware and CSCW", "q": "What is co-authoring? (p. 688 of HCI)", "k": ["co-authoring"], "a": ["Several people jointly writing a document, often asynchronously, using tools that support commenting, annotation, version control and the exchange of drafts."], "src": "D"}, {"n": 154, "u": "7", "s": "7.1 Groupware and CSCW", "q": "What is the difference between co-authoring and shared editing? (open question)", "k": ["awareness", "co-authoring", "feedthrough", "locking", "shared editing"], "a": ["Co-authoring is the overall collaborative writing process, often asynchronous, over days or weeks, with roles (author, reviewer), comments and versions.", "Shared editing is synchronous (or near) editing of the same document by several people at once, as in Google Docs, raising issues of concurrency, locking, awareness and feedthrough.", "Shared editing is one tool that can support co-authoring."], "src": "O"}, {"n": 155, "u": "7", "s": "7.1 Groupware and CSCW", "q": "How can groupware tools be differentiated by granularity of sharing? (pp. 695 to 696 of HCI)", "k": ["awareness", "feedthrough", "granularity", "granularity of sharing", "groupware", "groupware tools", "keystroke", "locking"], "a": ["Granularity is how small the shared units and updates are.", "Coarse: whole documents or files exchanged (email attachments); updates seen only when saved.", "Fine: paragraph, line or character-level locking, with each keystroke seen by others immediately (high feedthrough).", "Finer granularity gives better awareness but more conflicts, network load and distraction."], "src": "D"}, {"n": 156, "u": "7", "s": "7.1 Groupware and CSCW", "q": "What are five ways of testing robustness? (p. 712 of HCI)", "k": ["five ways of testing robustness", "groupware", "robustness", "stress", "testing", "users"], "a": ["Test the groupware under failure and stress: network failure or disconnection; slow networks and long delays; a participant's machine crashing mid-operation; server failure; many simultaneous users (scaling) and conflicting simultaneous actions.", "[List reconstructed from Dix 19.5 on robustness and scaling; check the exact five on p. 712.]"], "src": "D"}, {"n": 157, "u": "7", "s": "7.1 Ex 19.1", "q": "Ex 19.1: Consider the advantages and problems of a group pointer when participants have different views. How do you show it if it is outside your part of the document? Is a group pointer useful in a hypertext co-authoring system?", "k": ["co-authoring", "different views", "group pointer", "hypertext", "hypertext co-authoring system", "pointing"], "a": ["Different views make a group pointer more important, since references like 'the thing at the top' fail; but it can give a false sense of shared context, so switch to a shared view for synchronous discussion.", "Off-screen: a hand icon at the window edge pointing towards it, or a mark on the scrollbar; clicking scrolls to it. Show others' insertion points and views on the scrollbar.", "Hypertext: large nodes, same measures; different nodes, the pointer should first direct attention to the focus node (a 'go to focus node' button)."], "src": "W"}, {"n": 158, "u": "7", "s": "7.1 Ex 19.2", "q": "Ex 19.2: Look for shared data on your system. Is it updated by one person and viewed by many, or by several people? What methods prevent two users changing the same data at once (none, locking, or a social protocol)?", "k": ["locking", "shared data", "social protocol", "spreadsheet", "users"], "a": ["One-writer, many-readers: phone directories, intranet pages, published calendars.", "Many-writer: shared spreadsheets, wikis, shared folders.", "Mechanisms: none (last save wins), computerised locking or check-out (SharePoint, version control merge), social protocols (only Ann edits the roster, or passing the file along).", "Small groups usually rely on social protocols, sometimes unsuccessfully; implicit shared information (presence indicators) also supports cooperation."], "src": "W"}, {"n": 159, "u": "7", "s": "7.2 Ubiquitous Computing", "q": "What does implicit input mean? (pp. 718 to 719 of HCI)", "k": ["displays", "implicit input", "users"], "a": ["Input the system obtains from sensors or the environment without the user deliberately issuing a command, e.g. location, movement, presence, time; the system infers intent (doors opening, lights that turn on, a phone that rotates its display)."], "src": "D"}, {"n": 160, "u": "7", "s": "7.2 Ubiquitous Computing", "q": "What are the main questions that need to be answered for context awareness to function effectively? (pp. 725 to 726 of HCI)", "k": ["awareness", "context awareness", "context-awareness", "history", "users"], "a": ["<b>Who<\/b> is the user (and who else is around)?", "<b>Where<\/b> are they?", "<b>When<\/b> is it (time, history)?", "<b>What<\/b> are they doing?", "And <b>why<\/b>: inferring the user's intention, the hardest, plus how the system should act on it."], "src": "D"}, {"n": 161, "u": "7", "s": "7.2 Ubiquitous Computing", "q": "What are the three main theories that focus on the 'in the world' nature of knowledge? (pp. 729 to 731 of HCI)", "k": ["cognition", "in the world nature of knowledge", "plans", "three main theories"], "a": ["<b>Activity theory<\/b>: activity mediated by tools, within a community, towards an object.", "<b>Situated action<\/b>: actions arise in response to the immediate situation rather than from prior plans (Suchman).", "<b>Distributed cognition<\/b>: cognition spread across people, artifacts and the environment."], "src": "D"}, {"n": 162, "u": "7", "s": "7.2 Ex 20.1", "q": "Ex 20.1: Discuss how context-awareness, automated capture and the continuous interaction of everyday computing are relevant to domestic life, focusing on family life or an aging population.", "k": ["aging population", "automated capture", "awareness", "context-awareness", "continuous interaction", "domestic life", "everyday computing", "family life", "health", "privacy", "users"], "a": ["Context-awareness: home sensors detect falls, inactivity or wandering in older adults and alert family; reminders triggered by context (medication when in the kitchen).", "Automated capture: recording family events, health readings and daily routines without effort; family memories.", "Continuous everyday computing: activities without clear start or end (cooking, caring); interfaces must tolerate interruption and resumption.", "Challenges: privacy and surveillance, dignity and consent, false alarms, older users' unfamiliarity, who controls the data, reliability. Tutor-only on site."], "src": "O"}, {"n": 163, "u": "7", "s": "7.3 Virtual and Augmented Reality", "q": "What is an augmented reality (AR) interface?", "k": ["augmented reality", "augmented reality (AR) interface", "sound", "users", "VR"], "a": ["An interface that overlays computer-generated information (graphics, labels, sound) onto the user's view of the real world, aligned with real objects in real time, using a see-through headset, phone or projection.", "Unlike VR it keeps the user in the real environment; the key challenge is accurate registration of virtual and real."], "src": "D"}, {"n": 164, "u": "7", "s": "7.3 Virtual and Augmented Reality", "q": "What is the Camtree? (p. 742 of HCI)", "k": ["Camtree", "hierarchy"], "a": ["A 3D information visualisation of a hierarchy (Robertson, Mackinlay and Card): a cone tree laid on its side, so the hierarchy runs horizontally and text labels are easier to read.", "Cone trees place children in a ring at the base of a cone below the parent and rotate to bring a node to the front."], "src": "D"}, {"n": 165, "u": "7", "s": "7.3 Ex 20.2", "q": "Ex 20.2: Virtual reality has many applications in the games market. Is this a suitable use? Discuss benefits and disadvantages of exploiting leading-edge technology in a leisure market.", "k": ["games", "games market", "leading-edge technology", "leisure market", "virtual reality", "VR"], "a": ["Benefits: lucrative market drives development used later elsewhere; pushes cheaper equipment and more robust techniques (games hardware used in research); familiarity makes VR accessible and acceptable.", "Disadvantage: may trivialise VR so it is not taken seriously for weightier problems (judged less likely than the benefits)."], "src": "W"}, {"n": 166, "u": "7", "s": "7.3 Ex 20.3", "q": "Ex 20.3: Data visualisation has increased comprehension (atmosphere, ocean, molecules). What areas may benefit most from VR visualisation?", "k": ["architecture", "data visualisation", "VR", "VR visualisation"], "a": ["Most promising where real exploration is impossible (molecules) or dangerous (space).", "Models can be manipulated, not just observed.", "Areas: chemical and medical research, meteorology, oceanography, seismology (also architecture and training)."], "src": "W"}, {"n": 167, "u": "7", "s": "7.4 Hypertext, Multimedia and the Web", "q": "What is a distinguishing feature of the WWW? (p. 749 of HCI)", "k": ["distinguishing feature", "hypertext", "WWW"], "a": ["It is a hypertext distributed across many computers worldwide: links can point to documents on any server, and anyone can publish, so there is no central control or overall structure."], "src": "D"}, {"n": 168, "u": "7", "s": "7.4 Hypertext, Multimedia and the Web", "q": "Briefly describe the various types of rich content. (pp. 751 to 755 of HCI)", "k": ["accessibility", "bandwidth", "games", "rich content", "streaming", "video"], "a": ["<b>Animation<\/b>: moving images, used for attention, demonstration, and showing change.", "<b>Video and audio<\/b>: recorded or live media, streaming.", "<b>Computation and interaction<\/b>: applets and scripts allowing simulations, games and interactive content.", "<b>3D and virtual worlds<\/b> (VRML).", "Each adds richness but costs bandwidth and accessibility."], "src": "D"}, {"n": 169, "u": "7", "s": "7.4 Hypertext, Multimedia and the Web", "q": "What are two problems with hypertext? (p. 761 of HCI)", "k": ["hypertext"], "a": ["<b>Getting lost in hyperspace<\/b>: disorientation, not knowing where you are or how to get back.", "<b>Cognitive overload<\/b>: the effort of deciding which links to follow and remembering where you have been."], "src": "D"}, {"n": 170, "u": "7", "s": "7.4 Hypertext, Multimedia and the Web", "q": "What are some ways to make website navigation easier? (open question)", "k": ["navigation", "website navigation"], "a": ["Consistent global navigation bar on every page; breadcrumbs showing location; a site map and search; clear, descriptive link labels; visited-link colours; shallow broad structure; highlight the current section; a home link (logo); back button that works; meaningful page titles and URLs."], "src": "O"}, {"n": 171, "u": "7", "s": "7.4 Hypertext, Multimedia and the Web", "q": "From the point of view of web usability, what is the argument against long page layout? (p. 770 of HCI)", "k": ["layout", "long page layout", "printing", "usability", "users", "web usability"], "a": ["Users often do not scroll, so content below the first screen may be missed; long pages lose the sense of context (headers scroll away) and take longer to load.", "Counter-argument: printing and reading a whole article is easier on one page."], "src": "D"}, {"n": 172, "u": "7", "s": "7.4 Hypertext, Multimedia and the Web", "q": "What are the challenges of delivering movies and sound over the Internet? (p. 777 of HCI)", "k": ["accessibility", "bandwidth", "Internet", "movies and sound", "sound", "streaming", "users"], "a": ["Bandwidth: files are large, so download is slow; streaming needs a steady rate.", "Network delay and jitter cause stalls and broken sound.", "Compression trade-offs between size and quality, with processing cost.", "Formats and players or plug-ins must match on the client.", "Accessibility: captions and transcripts for deaf users."], "src": "D"}, {"n": 173, "u": "7", "s": "7.4 Hypertext, Multimedia and the Web", "q": "What are the three questions important to end users of dynamic web content? (p. 779 of HCI)", "k": ["dynamic web content", "end users", "users"], "a": ["From the user's point of view: <b>what<\/b> is changing; <b>by whom<\/b> (or what) it is changed; and <b>how often / when<\/b> it changes.", "[Dix 21.5 frames dynamic content by what changes, who changes it and how often; confirm wording on p. 779.]"], "src": "D"}, {"n": 174, "u": "7", "s": "7.4 Ex 21.1", "q": "Ex 21.1: Experiment with HyperCard or another hypertext system. Draw a map of its links. Is it clear where you are and where you can get to? If not, how could it be improved?", "k": ["experiments", "HyperCard", "hypertext", "hypertext system", "map of its links", "materials"], "a": ["Use any website or wiki today as the hypertext system.", "Drawing the map tests the navigational support and reveals structure.", "Common problems: no indication of location, links hidden, no route back.", "Improvements: an explicit map, escape (home) buttons, explicit paths to core material, breadcrumbs."], "src": "W"}, {"n": 175, "u": "7", "s": "7.4 Ex 21.3", "q": "Ex 21.3: What factors are likely to delay the widespread use of video in interfaces? What applications could benefit most from its use?", "k": ["bandwidth", "CSCW", "design", "games", "help", "video", "video in interfaces", "VR", "widespread use of video"], "a": ["Delaying factors: compression hardware and software cost, high bandwidth needs, equipment cost, lack of design tools, lack of designer skills.", "Beneficiaries: educational systems, games, help systems; VR combining video with graphics; CSCW face-to-face links.", "Caution: use video only where its consequences are understood; it may not fulfil its promise."], "src": "W"}, {"n": 176, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(10 marks) A credit union wants a self-service kiosk for customers over 70. List and justify ten design considerations.", "k": ["consistency", "credit union", "customers over 70", "design", "documentation", "evaluation", "help", "memory", "recognition", "self-service kiosk", "standards", "ten design considerations", "users", "vision"], "a": ["1 Low vision: large type, high contrast, never colour alone (perceptible information).", "2 Hearing: show every audio prompt as text too (multimodal output).", "3 Motor control: large, well-spaced touch targets (Fitts' law; low physical effort).", "4 Memory: one step per screen with a step counter (reduce short-term memory load; recognition over recall).", "5 Errors: confirm before money moves, easy undo (error prevention; permit easy reversal).", "6 Feedback: immediate on-screen and audible response to each touch (visibility of system status).", "7 Time: generous time-outs with warning and 'more time' (user control and freedom).", "8 Language: plain words, error messages that say how to fix (match real world; help recover from errors).", "9 Consistency: same button positions on every screen (consistency and standards).", "10 Help: visible help button and call-staff option (help and documentation).", "Bonus: test with real older users on site (field evaluation)."], "src": "G"}, {"n": 177, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(8 marks) A mobile login screen shows 'Error 401' on failure, has a tiny 'forgot password' link, and clears the form after each failure. Find the problems, name the heuristic each breaks, rate severity, and give a fix.", "k": ["Error 401", "flexibility", "forgot password link", "help", "heuristics", "mobile login screen", "recognition", "severity", "users"], "a": ["'Error 401': breaks <b>help users recognize, diagnose and recover from errors<\/b> and <b>match with the real world<\/b>; severity 3; fix: 'Email or password is incorrect. Try again or reset your password.'", "Tiny forgot link: breaks <b>visibility<\/b> and <b>flexibility<\/b>, plus Fitts' law (small target on touch); severity 3; fix: full-width, readable link near the password field.", "Form cleared: breaks <b>user control and freedom<\/b> and <b>error prevention<\/b> / recognition over recall (user must retype); severity 3; fix: keep the email, clear only the password, show which field failed.", "Severity scale 0 to 4 (0 none, 1 cosmetic, 2 minor, 3 major, 4 catastrophe)."], "src": "G"}, {"n": 178, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(10 marks) A clinic must evaluate a new patient check-in system before launch, on a small budget with two weeks left. Which evaluation methods, in what order, and why?", "k": ["evaluation", "evaluation methods", "health", "heuristics", "learnability", "patient check-in system", "plans", "privacy", "questionnaire", "satisfaction", "severity", "small budget", "stakeholders", "usability"], "a": ["1 Heuristic evaluation by 3 to 5 evaluators (cheap, fast, finds about 75% of problems).", "2 Cognitive walkthrough of the key task 'check in for an appointment' for first-time patients (learnability).", "3 Fix the major and catastrophic issues found (severity 3 to 4).", "4 Small usability test (5 representative patients incl. older and low-literacy) with think-aloud or cooperative evaluation.", "5 Measure completion rate, time, errors; short satisfaction questionnaire (SUS or Likert).", "6 Pilot in the real clinic waiting room (field study) for context: noise, interruptions, queue.", "7 Interview reception staff (secondary stakeholders).", "8 Consent and privacy (health data: use fake records).", "9 Choice justified by factors: stage, resources, immediacy, intrusiveness.", "10 Plan post-launch monitoring (logs, feedback)."], "src": "G"}, {"n": 179, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(6 marks) Explain the gulf of execution and the gulf of evaluation using a smart thermostat, and propose one design change that narrows each.", "k": ["design", "design change", "displays", "evaluation", "gulf of evaluation", "gulf of execution", "gulfs", "menus", "Norman", "perception", "smart thermostat", "users"], "a": ["Gulf of execution: gap between the user's goal ('warmer at 7 a.m.') and the actions the system allows; e.g. schedule hidden in nested menus.", "Fix: a visible 'schedule' control with direct manipulation of a timeline.", "Gulf of evaluation: gap between the system's state and the user's ability to perceive and interpret it; e.g. no indication whether heating is on or a schedule is set.", "Fix: clear display of current temperature, target, 'heating now' indicator and next scheduled change.", "Norman's 7 stages: goal, intention, action specification, execution / perception, interpretation, evaluation."], "src": "G"}, {"n": 180, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(8 marks) Produce a hierarchical task analysis, with plans, for 'book a study room in the library'.", "k": ["hierarchical task analysis", "plans", "study room"], "a": ["0. Book a study room", "1. Log in to booking system (1.1 open site; 1.2 enter ID; 1.3 enter password)", "2. Find a room (2.1 choose date; 2.2 choose time; 2.3 choose size/features; 2.4 view available rooms)", "3. Select room and time slot", "4. Confirm booking (4.1 review details; 4.2 confirm; 4.3 note confirmation)", "5. Log out", "Plan 0: do 1-2-3-4-5; if no room available at 2.4, repeat 2 with a different time.", "Plan 2: do 2.1 and 2.2 in any order, 2.3 optional, then 2.4.", "Plan 4: 4.1 then 4.2; 4.3 optional."], "src": "G"}, {"n": 181, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(6 marks) Draw a state transition network for a login dialog with lock-out after three failures; check it for completeness, determinism, reversibility and dangerous states.", "k": ["completeness", "dangerous states", "determinism", "dialog", "lock-out", "login dialog", "reversibility", "state transition network", "users"], "a": ["States: Start (enter credentials) -> Fail1 -> Fail2 -> Locked; any state -> Success on correct credentials.", "Arcs: submit-wrong moves Start->Fail1->Fail2->Locked; submit-right moves to Logged in; timeout or admin reset moves Locked->Start.", "Completeness: every state has an arc for both wrong and right input (and cancel).", "Determinism: one arc per input per state.", "Reversibility: from Locked only via reset or timeout (deliberately irreversible by the user); from Logged in, logout returns to Start.", "Dangerous state: Locked; warn on Fail2 ('one attempt left') and offer password reset."], "src": "G"}, {"n": 182, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(6 marks) Use the keystroke-level model to compare deleting a file with the right-click menu against using the Delete key. Show each operator and totals.", "k": ["Delete key", "dialog", "keystroke", "keystroke-level model", "menus", "right-click menu"], "a": ["Assume hand on mouse, file visible. Times: M 1.35, P 1.1, B 0.1 (click = BB 0.2), H 0.4, K 0.28.", "Right-click menu: M + P (to file) + BB (right-click) + M + P (to Delete item) + BB = 1.35+1.1+0.2+1.35+1.1+0.2 = <b>5.30 s<\/b>.", "Delete key: M + P (to file) + BB (select) + H (to keyboard) + M + K (Delete) = 1.35+1.1+0.2+0.4+1.35+0.28 = <b>4.68 s<\/b>.", "Add a confirmation dialog to both: + M + K (Enter) or P + BB.", "Delete key is faster, especially when the hand is already on the keyboard (no H)."], "src": "G"}, {"n": 183, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(8 marks) A firm rolls out a shared team calendar and few people use it. Explain the socio-organisational reasons and what you would change.", "k": ["CUSTOM", "design", "privacy", "shared team calendar", "socio-organisational", "socio-organisational reasons", "stakeholders", "users"], "a": ["Free rider and critical mass: value only exists if everyone enters events; early users get nothing back.", "Disparity of benefit (Grudin): managers gain from scheduling, staff do the extra data entry.", "Privacy and loss of control over one's own time; fear of surveillance.", "Existing social protocols (email, asking in person) already work.", "Not designed with the stakeholders (CUSTOM, participatory design).", "Changes: management mandate and leading by example; integrate with existing email/phone so entry is automatic; show benefit to every user (find free times, reminders); privacy controls (busy/free only); training and champions; involve users in redesign."], "src": "G"}, {"n": 184, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(8 marks) Design the help and user-support features for a tax-filing application.", "k": ["design", "documentation", "help", "help and user-support features", "novice", "tax-filing application", "users"], "a": ["Context-sensitive help next to each field ('what is this box?').", "Task-specific help: guided wizard through the return.", "Quick reference: glossary of tax terms in plain language.", "Full explanation: links to official rules for complex cases.", "Tutorial for first-time filers.", "Searchable online documentation and FAQ.", "Error messages that explain and suggest fixes (e.g. 'SIN must be 9 digits').", "Requirements: available everywhere, accurate for this tax year, consistent, unobtrusive, flexible for novice vs accountant users; human help (chat/phone) for edge cases."], "src": "G"}, {"n": 185, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(6 marks) Compare the Seeheim model and MVC for structuring the interface of a small desktop app.", "k": ["design", "dialog", "lexical", "MVC", "Seeheim", "Seeheim model", "semantic", "small desktop app", "syntactic", "toolkits", "UIMS"], "a": ["Seeheim: three logical layers: presentation, dialog control, application interface model (plus bypass for rapid feedback); describes the whole interface as one stack.", "MVC: model, view, controller triples per object; fine-grained and object-oriented.", "Seeheim separates by linguistic level (lexical, syntactic, semantic); MVC separates input from output for each object.", "MVC supports multiple synchronised views of the same data easily.", "Seeheim suited to conceptual design and UIMS; MVC maps onto modern toolkits and frameworks.", "For a small desktop app MVC (or a variant) is the practical choice."], "src": "G"}, {"n": 186, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(8 marks) A museum wants an augmented-reality guide app. Discuss ubicomp and AR issues, including context awareness, privacy and how you would evaluate it.", "k": ["accessibility", "augmented-reality guide app", "awareness", "context awareness", "context-awareness", "evaluation", "observation", "privacy", "questionnaire", "ubicomp", "users", "vision"], "a": ["Context awareness: who (visitor type, language, age), where (room, exhibit via beacons or vision), when (busy times), what (looking at which object).", "Registration: overlays must line up with exhibits; lighting and occlusion.", "Implicit input: show content automatically when near an exhibit, with an easy way to dismiss.", "Attention and safety: users walking with phones; keep overlays brief.", "Accessibility: audio descriptions, captions, large text.", "Privacy: location tracking of visitors; consent, anonymised data.", "Battery and network limits.", "Evaluation: field study in the museum with observation and interviews, logging of dwell time, cooperative evaluation early, questionnaires on experience."], "src": "G"}, {"n": 187, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(6 marks) Users of a large intranet say they get 'lost'. Give the causes and the design remedies.", "k": ["design", "design remedies", "large intranet", "navigation", "users"], "a": ["Causes: deep hierarchies; inconsistent navigation between departments; no indication of current location; vague link labels; broken links; poor search.", "Remedies: consistent global navigation; breadcrumbs; site map; good search with filters; shallow broad structure; descriptive labels and page titles; highlight current section; regular link checking."], "src": "G"}, {"n": 188, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(10 marks) Plan a user study for a fitness-tracking app: participants, consent, tasks, data, analysis, and how you would report the findings.", "k": ["fitness-tracking app", "health", "learnability", "novice", "observation", "plans", "questionnaire", "satisfaction", "severity", "user study", "users"], "a": ["1 Goals: learnability of setup and logging; satisfaction.", "2 Participants: 5 to 8 representative users (novice and regular exercisers, mixed age); recruitment.", "3 Consent: informed consent form, right to withdraw, anonymised data, health data care.", "4 Pilot study first.", "5 Tasks: set up profile, log a workout, set a goal, read weekly progress.", "6 Method: think-aloud in lab plus 1-week diary study in the field.", "7 Data: completion, time, errors, observations, SUS questionnaire, interview quotes.", "8 Analysis: problems by severity, quantitative summaries, themes in qualitative data.", "9 Validity: counterbalance tasks, avoid leading questions.", "10 Report: method, participants, findings ranked by severity with evidence and recommended fixes."], "src": "G"}, {"n": 189, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(8 marks) A warehouse replaces a command-line stock system with a touch-screen GUI. Which interaction styles and principles should guide the redesign, and what risks do you see for expert users?", "k": ["command-line stock system", "consistency", "design", "expert users", "experts", "flexibility", "interaction styles", "KLM", "menus", "novice", "recognition", "Shneiderman", "touch-screen GUI", "users"], "a": ["Styles: menus and form-fill for novices; direct manipulation on touch; keep a command or barcode-scan input for speed.", "Principles: recognition over recall; Fitts' law (large targets for gloved hands); feedback; consistency; error prevention for stock quantities.", "Flexibility: shortcuts and accelerators for frequent users (Shneiderman rule 2); customisability.", "Expert risks: slower than typed commands (more P and M operators by KLM); loss of proceduralised skills; frustration and resistance; reduced productivity in transition.", "Mitigation: involve experts (participatory design), keep a keyboard/scan mode, train, phase rollout, measure task times before and after."], "src": "G"}, {"n": 190, "u": "P", "s": "Practice scenarios (pass guide)", "q": "(Exam may ask about your own assignments) Summarise your Assignment 1 design and Assignment 2 findings so you can describe how you did them.", "k": ["A1", "Assignment 1", "Assignment 2", "assignments", "design", "evaluation", "scenario", "users"], "a": ["A1 (file on disk): <b>BorderTransfer<\/b>, a desktop guided interface for personal USD to CAD and CAD to USD bank transfers: quote without paying, enter or choose recipient, choose source account, review and confirm, correct a draft, track progress, cancel an eligible transfer; users = first-time and returning senders, keyboard and enlarged-text users; A3 = Java Swing with simulated services.", "Be ready to explain: user groups, task scenarios, low-fidelity prototype, design principles applied, and how the A2 evaluation with 3 to 5 real participants changed the design.", "Warning: the A1 file on disk is marked as an AI-generated draft with no real user work done; the exam answer must describe your own submitted work."], "src": "G"}], "units": {"1": "Unit 1 Foundations", "2": "Unit 2 Design process", "3": "Unit 3 Implementation", "4": "Unit 4 Evaluation and support", "5": "Unit 5 User models", "6": "Unit 6 Task models and dialogs", "7": "Unit 7 Groupware, ubicomp, VR, web", "P": "Practice scenarios"}, "src": {"D": "Dix reading", "W": "hcibook.com model answer", "O": "Worked answer", "G": "Pass guide practice"}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&(?!amp;|lt;|gt;)/g,'&amp;');
const kwCount={};D.items.forEach(e=>e.k.forEach(k=>kwCount[k]=(kwCount[k]||0)+1));
const kws=Object.keys(kwCount).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
const lb=$('#kw');let sel='',cur=0;
lb.innerHTML=['',...kws].map((k,i)=>'<div class="opt" role="option" id="o'+i+'" data-k="'+k+'" aria-selected="false"><span>'+(k||'All keywords')+'</span><span class="c">'+(k?kwCount[k]:D.items.length)+'</span></div>').join('');
const opts=[...lb.children];
function setSel(k,scroll){sel=k;opts.forEach((o,i)=>{const on=o.dataset.k===k;o.setAttribute('aria-selected',on);if(on)cur=i});
  setCur(cur,scroll)}
function setCur(i,scroll){cur=Math.max(0,Math.min(opts.length-1,i));opts.forEach((o,j)=>o.classList.toggle('cur',j===cur));lb.setAttribute('aria-activedescendant','o'+cur);
  if(scroll!==false){const o=opts[cur];if(o.offsetTop<lb.scrollTop||o.offsetTop+o.offsetHeight>lb.scrollTop+lb.clientHeight)lb.scrollTop=o.offsetTop-lb.clientHeight/2}}
lb.addEventListener('click',e=>{const o=e.target.closest('.opt');if(o){setSel(o.dataset.k,false);$('#f').requestSubmit();lb.blur();window.scrollTo(0,$('#main').getBoundingClientRect().top+window.scrollY)}});
lb.addEventListener('keydown',e=>{const m={ArrowDown:1,ArrowUp:-1,PageDown:5,PageUp:-5}[e.key];
  if(m){e.preventDefault();setSel(opts[Math.max(0,Math.min(opts.length-1,cur+m))].dataset.k)}
  else if(e.key==='Enter'){e.preventDefault();$('#f').requestSubmit()}});
setSel('',false);
let active='', unit='';
function render(){
  const m=$('#main');let h='';let shown=0;let lastU=null;
  if(!active&&!unit)h+='<p class="note">Questions are the study-guide exercises for every unit (the final exam is based on the required readings and these activities), plus practice scenarios. Tap a question to show or hide its answer. Tap a keyword in the list to filter. Tap Top under any card to return here.</p>';
  D.items.forEach(e=>{
    if(active&&!e.k.includes(active))return;
    if(unit&&e.u!==unit)return;
    if(e.u!==lastU){lastU=e.u;h+='<h2 id="u'+e.u+'">'+D.units[e.u]+'</h2>'}
    shown++;
    h+='<article class="card" id="q'+e.n+'"><div class="meta"><span class="num">Q'+e.n+'</span><span>'+esc(e.s)+'</span><span class="src '+e.src+'">'+D.src[e.src]+'</span></div>'
     +'<div class="q" role="button" tabindex="0" aria-expanded="false"><span class="car">&#9656;</span><span>'+esc(e.q)+'</span></div><div class="tags">'
     +e.k.map(k=>'<span class="tag'+(k===active?' hit':'')+'">'+k+'</span>').join('')+'</div><ul class="a">'+e.a.map(x=>'<li>'+x+'</li>').join('')+'</ul><button type="button" class="totop">&#8593; Top</button></article>';
  });
  if(!shown)h+='<p class="empty">No questions match.</p>';
  m.innerHTML=h;if(typeof resetAll==='function')resetAll();
  $('#status').innerHTML='<b>'+shown+'</b> of '+D.items.length+' questions'+(active?' &middot; keyword <b>'+active+'</b>':'')+(unit?' &middot; <b>'+D.units[unit]+'</b>':'');
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.u===unit));
  setHH();
}
$('#f').addEventListener('submit',e=>{e.preventDefault();active=sel;unit='';render();window.scrollTo(0,0)});
$('#reset').addEventListener('click',()=>{setSel('');active='';unit='';render();window.scrollTo(0,0)});
$('#main').addEventListener('click',e=>{const qq=e.target.closest('.q');if(qq){openCard(qq.parentElement);return}if(e.target.closest('.totop'))window.scrollTo(0,0)});
function openCard(c,force){const on=force===undefined?!c.classList.contains('open'):force;c.classList.toggle('open',on);c.querySelector('.q').setAttribute('aria-expanded',on)}
$('#main').addEventListener('keydown',e=>{const qq=e.target.closest('.q');if(qq&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openCard(qq.parentElement)}});
let allOpen=false;$('#tog').addEventListener('click',e=>{allOpen=!allOpen;document.querySelectorAll('.card').forEach(c=>openCard(c,allOpen));const b=e.currentTarget;b.querySelector('.lbl').textContent=allOpen?'Hide':'Show';b.setAttribute('aria-pressed',allOpen)});
const topB=$('#top');topB.addEventListener('click',()=>window.scrollTo(0,0));
window.addEventListener('scroll',()=>{topB.style.display=window.scrollY>400?'block':'none'},{passive:true});
function setHH(){document.documentElement.style.setProperty('--hh',($('#hdr').offsetHeight+8)+'px')}
window.addEventListener('resize',setHH);
['contextmenu','copy','cut','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(!(e.target.closest&&e.target.closest('select')))e.preventDefault()}));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','a','s','p','u'].includes(k)){e.preventDefault()}});
render();
function resetAll(){allOpen=false;$('#tog .lbl').textContent='Show'}
</script>
