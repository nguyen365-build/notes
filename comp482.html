<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>COMP482 Exam Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--bg:#14181F;--panel:#1B212B;--panel2:#222A36;--line:#2E3846;--text:#E6E9EE;--muted:#9AA4B2;--amber:#F2A53C;--amber2:#FFC36E;--ok:#6CC08B;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 var(--sans);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#main{min-height:100vh}
header{position:relative;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
 padding-block:8px;padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr))}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font:600 14px var(--mono);color:var(--amber);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
form{display:flex;gap:8px;flex:1 1 100%;min-width:0;align-items:stretch}
.lb{flex:1 1 auto;min-width:0;height:204px;overflow-y:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lb:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.opt{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:17px;line-height:1.3}
.opt .c{font:14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.opt.cur{background:var(--line)}
.opt[aria-selected="true"]{background:var(--amber);color:#14181F;font-weight:600}
.opt[aria-selected="true"] .c{color:#14181F}
.acts{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.acts button{height:44px}
select,button{font:18px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;height:38px}
select{min-width:0;flex:1 1 auto;padding:0 8px}
button{padding:0 12px;cursor:pointer;white-space:nowrap}
button.pri{background:var(--amber);color:#14181F;border-color:var(--amber);font-weight:600}
#jump{flex:1 1 220px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{font:14px var(--mono);height:30px;padding:0 10px;border-radius:15px;background:var(--panel);color:var(--muted);flex:0 0 auto}
.chip.on{color:#14181F;background:var(--amber);border-color:var(--amber)}
.status{font:14px var(--mono);color:var(--muted);margin-top:6px}
.status b{color:var(--amber2);font-weight:600}
main{padding-block:12px 80px;padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));max-width:1100px;margin:0 auto}
h2{font:600 15px var(--mono);color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px;scroll-margin-top:var(--hh,120px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;scroll-margin-top:var(--hh,120px)}
.card.flash{border-color:var(--amber)}
.meta{font:14px var(--mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.num{color:var(--amber);font-weight:600}
.q{font-weight:600;margin:4px 0 0;font-size:18px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.a{margin:0;padding-left:20px}
.a li{margin:3px 0}
.a b{color:var(--amber2)}
.a{display:none;margin-top:8px}.card.open .a{display:block}.q .car{color:var(--amber);flex:0 0 auto;transition:transform .15s}.card.open .q .car{transform:rotate(90deg)}.q:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font:13px var(--mono);line-height:26px;padding:0 8px;border-radius:12px;background:var(--panel2);color:var(--muted);cursor:default}
.totop{display:block;margin:10px 0 0 auto;font:14px var(--mono);height:34px;padding:0 12px;color:var(--amber);background:transparent;border:1px solid var(--line);border-radius:17px}
.tag.hit{color:#14181F;background:var(--amber)}
.src{margin-left:auto}
.src.O{color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:40px}
#top{position:fixed;right:calc(14px + var(--sr));bottom:14px;width:44px;height:44px;border-radius:22px;z-index:11;font-size:18px;display:none}
.note{font-size:15px;color:var(--muted);border-left:3px solid var(--amber);padding:6px 10px;background:var(--panel);border-radius:0 8px 8px 0}
@media (max-height:500px) and (orientation:landscape){
 header{padding-top:5px;padding-bottom:5px}
 .chips{margin-top:5px}
 .status{display:none}
 .brand{display:none}
 .lb{height:156px}
 .acts button{height:44px}
 .chip{height:30px}
}
@media print{body{display:none}}
</style>

 <div class="bar">

 </div>

<script>
const D={"items": [{"n": 1, "u": "1", "s": "1.1 Human Capabilities", "q": "What are the five principles of the EC Directive 90/270/EEC? (p. 3 in HCI)", "k": ["90/270/EEC", "EC Directive", "ergonomics", "five principles", "performance"], "a": ["Software must be suitable for the task.", "Software must be easy to use and adaptable to the operator's level of knowledge or experience.", "The system must give operators feedback on their performance.", "Information must be displayed in a format and at a pace adapted to the operators.", "The principles of software ergonomics must be applied, especially to human data processing (and no checking of quantity or quality of work without the worker's knowledge)."], "src": "D"}, {"n": 2, "u": "1", "s": "1.1 Human Capabilities", "q": "List and briefly describe the three functions of visual perception that are relevant to HCI. (pp. 15 to 18 in HCI)", "k": ["displays", "perception", "three functions", "visual perception"], "a": ["<b>Perceiving size and depth<\/b>: visual angle, size constancy and depth cues (overlap, size, height in the field, familiarity) tell us how big and how far away objects are.", "<b>Perceiving brightness<\/b>: brightness is a subjective reaction to luminance; visual acuity rises with luminance, but so does flicker, so displays need enough contrast and refresh.", "<b>Perceiving colour<\/b>: hue, intensity and saturation; about 8% of men are colour blind (often red-green), so colour must never be the only cue."], "src": "D"}, {"n": 3, "u": "1", "s": "1.1 Human Capabilities", "q": "Describe the characteristics of the three stores of human memory. (pp. 27 to 39 of HCI)", "k": ["human memory", "memory", "semantic", "sound", "three stores"], "a": ["<b>Sensory memory<\/b>: buffers for each sense (iconic = sight, echoic = sound, haptic = touch); constantly overwritten, lasts about 0.5 s; attention filters what passes on.", "<b>Short-term (working) memory<\/b>: a scratch pad; rapid access (about 70 ms), rapid decay (about 200 ms), limited capacity of 7 plus or minus 2 chunks; chunking and closure increase what fits.", "<b>Long-term memory<\/b>: huge or unlimited capacity, slower access (about 0.1 s), slow decay; holds episodic memory (events) and semantic memory (facts, concepts, skills), structured as networks, frames and scripts."], "src": "D"}, {"n": 4, "u": "1", "s": "1.1 Human Capabilities", "q": "Explain the possible relationship between short-term memory and long-term memory. (p. 36 of HCI)", "k": ["interference", "long-term memory", "memory", "recognition", "short-term memory"], "a": ["Information passes from short-term to long-term memory mainly through <b>rehearsal<\/b> (repeated exposure).", "Total time hypothesis: the amount learned is roughly proportional to time spent rehearsing; distribution of practice: spaced learning works better than massed.", "Structure, meaning and familiarity make transfer much easier (meaningful words are remembered better than nonsense).", "Retrieval from LTM back into working memory is by recall or recognition; recognition is easier, which is why interfaces should show options.", "Forgetting happens through decay and interference (retroactive and proactive)."], "src": "D"}, {"n": 5, "u": "1", "s": "1.1 Human Capabilities", "q": "Describe three types of reasoning. (pp. 40 to 42 of HCI)", "k": ["reasoning", "three types of reasoning"], "a": ["<b>Deductive<\/b>: derives the logically necessary conclusion from premises; can be logically valid yet untrue if a premise is false, and people mix in world knowledge.", "<b>Inductive<\/b>: generalises from cases seen to cases not seen; useful but unreliable (one counterexample breaks it); people favour confirming evidence.", "<b>Abductive<\/b>: reasons from a fact to the action or state that caused it; people explain events this way, which leads to false beliefs about how a system works if the interface misleads them."], "src": "D"}, {"n": 6, "u": "1", "s": "1.1 Human Capabilities", "q": "Describe two long-term and two short-term individual differences relevant for HCI. (pp. 52 to 53 of HCI)", "k": ["design", "individual differences", "memory", "stress", "users", "vision"], "a": ["Long-term: <b>sex<\/b> and <b>physical and intellectual abilities<\/b> (e.g. vision, dexterity, cognitive style).", "Short-term: <b>stress<\/b> and <b>fatigue<\/b> (also sickness, emotional state), which reduce attention and memory capacity.", "A third group changes through time: <b>age<\/b>.", "Design must allow for the whole range, not an average user."], "src": "D"}, {"n": 7, "u": "1", "s": "1.1 Human Capabilities", "q": "Provide an example of a computer system that would be greatly affected by short-term differences (open question).", "k": ["computer system", "design", "layout", "memory", "short-term differences", "stress", "users"], "a": ["Example: an emergency-room patient-monitoring or medication system, or an air-traffic control console.", "Users work under stress, fatigue at the end of long shifts and frequent interruption.", "Design responses: large clear alarms, confirmation on dangerous actions, minimal memory load, consistent layout so tired users rely on habit."], "src": "D"}, {"n": 8, "u": "1", "s": "1.1 Human Capabilities", "q": "Provide an example of a computer system that would be greatly affected by long-term differences (open question).", "k": ["computer system", "design", "long-term differences", "users", "vision"], "a": ["Example: a public banking kiosk or government tax site used by everyone, including older adults and people with low vision or motor impairments.", "Long-term differences (age, visual acuity, dexterity, literacy) are permanent for that user.", "Design responses: large text and targets, high contrast, screen-reader support, plain language, no time pressure."], "src": "D"}, {"n": 9, "u": "1", "s": "1.1 Human Capabilities", "q": "Describe three ways that psychology contributes to HCI. (pp. 53 to 54 of HCI)", "k": ["design", "evaluation", "GOMS", "guidelines", "performance", "psychology", "recognition", "users"], "a": ["<b>Understanding<\/b>: theory explains how people perceive, remember and reason, so designers can predict where users will struggle.", "<b>Guidelines and principles<\/b>: findings become direct design advice (e.g. recognition is easier than recall, so show options; 7 plus or minus 2 limits).", "<b>Models and evaluation methods<\/b>: cognitive models (e.g. GOMS) and experimental techniques let designers predict and measure performance.", "Caution: results must be applied in context; psychology rarely gives a ready-made answer."], "src": "D"}, {"n": 10, "u": "1", "s": "1.1 Human Capabilities", "q": "Observe skilled and novice operators in a familiar domain (e.g. touch vs hunt-and-peck typists, expert vs novice game players). What differences can you discern between their behaviors?", "k": ["design", "experts", "games", "help", "menus", "novice", "plans", "skilled and novice operators", "touch vs hunt-and-peck typists"], "a": ["Experts work fast with few errors; novices are slow and error prone.", "Experts have <b>proceduralised<\/b> skills (automatic, little conscious attention: touch typists do not look at keys); novices use declarative knowledge step by step.", "Experts <b>chunk<\/b> information and plan ahead; novices handle one item at a time.", "Experts recover from errors quickly and use shortcuts; novices rely on menus, help and visual search.", "Experts keep attention on the goal; novices split attention between the device and the task.", "Design implication: support both, with visible options for novices and accelerators for experts."], "src": "O"}, {"n": 11, "u": "1", "s": "1.1 Human Capabilities", "q": "From what you have learned about cognitive psychology, devise appropriate guidelines for interface designers, grouped under headings such as visual perception, memory, problem solving.", "k": ["cognitive psychology", "consistency", "experts", "guidelines", "help", "interface designers", "memory", "perception", "problem solving", "psychology", "reasoning", "recognition", "users", "visual perception"], "a": ["<b>Visual perception<\/b>: high contrast; never colour alone; group related items (Gestalt proximity and similarity); keep important items in a consistent location.", "<b>Attention<\/b>: use movement and colour sparingly for alerts; avoid clutter.", "<b>Memory<\/b>: recognition over recall; keep items under 7 plus or minus 2 or chunk them; show context instead of making users remember earlier screens.", "<b>Learning<\/b>: consistency so knowledge transfers; meaningful names; help when first used.", "<b>Problem solving and reasoning<\/b>: show the system state so users build a correct mental model; give feedback so abductive guesses are corrected.", "<b>Errors<\/b>: prevent slips with constraints and confirmation; make undo easy; write constructive error messages.", "<b>Individual differences<\/b>: allow customisation for experts and for impairments."], "src": "O"}, {"n": 12, "u": "1", "s": "1.2 The Computer", "q": "Describe two broad categories of interaction devices. (p. 61 of HCI)", "k": ["dialog", "displays", "handwriting", "interaction devices", "pointing", "printing", "sound", "speech", "two broad categories"], "a": ["<b>Input devices<\/b>: text entry (keyboards, handwriting, speech) and pointing and positioning (mouse, touchscreen, etc.).", "<b>Output devices<\/b>: displays (screens, large and situated displays) plus other outputs (sound, printing, haptics).", "Dix stresses that interaction is shaped by these devices: the choice of device affects the style and speed of the dialog. [Category split checked against course notes only; confirm wording on p. 61.]"], "src": "D"}, {"n": 13, "u": "1", "s": "1.2 The Computer", "q": "Describe the three broad categories of text entry devices. (pp. 63 to 71 of HCI)", "k": ["co-articulation", "handwriting", "recognition", "speech", "text entry devices", "three broad categories", "users"], "a": ["<b>Keyboards<\/b>: QWERTY, alphabetic, Dvorak, chord keyboards, phone keypads with T9 predictive entry.", "<b>Handwriting recognition<\/b>: natural for many users and for pen devices, but recognition is hard (writer variation, co-articulation of joined letters).", "<b>Speech recognition<\/b>: hands-free and fast, but error prone with noise, accents and vocabulary size."], "src": "D"}, {"n": 14, "u": "1", "s": "1.2 The Computer", "q": "List nine 2D pointing devices. (pp. 71 to 78 of HCI)", "k": ["2D pointing devices", "pointing", "pointing devices"], "a": ["Mouse", "Touchpad", "Trackball", "Thumbwheel", "Joystick (absolute and isometric)", "Keyboard nipple (trackpoint)", "Touch-sensitive screen", "Stylus and light pen", "Digitizing tablet", "Also listed: eyegaze, cursor keys and discrete positioning controls."], "src": "D"}, {"n": 15, "u": "1", "s": "1.2 The Computer", "q": "What is situated display? Give an example. (p. 85 of HCI)", "k": ["displays", "situated display"], "a": ["A display placed in a particular physical location so that its content relates to that place and the people passing it (public or semi-public).", "Examples: Lancaster's Hermes office-door displays where visitors leave messages and owners post status; departure boards at a station; a room-booking screen outside a meeting room."], "src": "D"}, {"n": 16, "u": "1", "s": "1.2 The Computer", "q": "Outline the problems with preparing a presentation for both print and screen. (pp. 102 to 103 of HCI)", "k": ["layout", "metrics", "print and screen", "WYSIWYG"], "a": ["<b>Resolution<\/b>: printers are far higher resolution than screens, so fonts and fine lines look different.", "<b>Page size and aspect ratio<\/b>: a screen is not an A4 or letter page, so WYSIWYG layouts must be scaled or scrolled.", "<b>Colour<\/b>: screens mix light (RGB) and printers mix ink (CMYK); colours do not match.", "<b>Fonts<\/b>: screen fonts and printer fonts differ in metrics, so line breaks change.", "<b>Reading<\/b>: screen text is harder to read, so screen versions need larger type and shorter blocks."], "src": "D"}, {"n": 17, "u": "1", "s": "1.2 The Computer", "q": "Explain the Von Neumann bottleneck and specify the constraints of the underlying architecture. (pp. 107 to 111 of HCI)", "k": ["architecture", "memory", "performance", "underlying architecture", "Von Neumann bottleneck"], "a": ["In the Von Neumann architecture the processor and memory are separate, and every instruction and data item must pass along one channel between them.", "The speed of that transfer, not the processor, limits performance: the <b>bottleneck<\/b>.", "Constraints: limited fast memory (RAM is volatile and small compared with disk); slower storage access; processor speed; network speed.", "Moore's law raises processing speed but interaction still hits these limits, so designers must allow for delays."], "src": "D"}, {"n": 18, "u": "1", "s": "1.2 The Computer", "q": "Describe four limitations on interactive performance presented in your textbook. (pp. 117 to 118 of HCI)", "k": ["bandwidth", "displays", "four limitations", "interactive performance", "memory", "performance", "users", "video"], "a": ["<b>Computation bound<\/b>: heavy processing makes the user wait; give progress feedback.", "<b>Storage channel bound<\/b>: speed of memory and disk access limits work with large data.", "<b>Graphics bound<\/b>: rendering the display is the bottleneck (complex graphics, video).", "<b>Network capacity<\/b>: bandwidth and latency of the network limit remote interaction."], "src": "D"}, {"n": 19, "u": "1", "s": "1.3 The Interaction", "q": "What are the extremes of interactivity in computer systems? (p. 124 of HCI)", "k": ["extremes of interactivity", "interactivity", "users"], "a": ["At one extreme, <b>batch processing<\/b>: the user supplies all input at once and waits for output with no interaction in between.", "At the other extreme, <b>highly interactive<\/b> systems with continuous, immediate feedback such as direct manipulation and virtual reality, where the user acts and sees the result at once."], "src": "D"}, {"n": 20, "u": "1", "s": "1.3 The Interaction", "q": "Describe the interaction framework outlined in your text. (pp. 127 to 130 of HCI)", "k": ["evaluation", "gulfs", "interaction framework", "Norman", "observation", "performance", "users"], "a": ["Abowd and Beale's framework has four parts: <b>User (U)<\/b>, <b>Input (I)<\/b>, <b>System (S)<\/b>, <b>Output (O)<\/b>; each speaks its own language (user = task language, system = core language).", "Four translations make an interaction cycle: <b>articulation<\/b> (user intention to input), <b>performance<\/b> (input to system operation), <b>presentation<\/b> (system state to output), <b>observation<\/b> (output to user understanding).", "Problems arise where a translation is hard: articulation and performance form the execution side, presentation and observation the evaluation side.", "It extends Norman's execution-evaluation cycle (7 stages, gulfs of execution and evaluation) by including the system side."], "src": "D"}, {"n": 21, "u": "1", "s": "1.3 The Interaction", "q": "Describe the ACM framework for HCI. (pp. 130 to 131 of HCI)", "k": ["ACM framework", "architecture", "design", "dialog", "ergonomics", "evaluation", "implementation", "organisation"], "a": ["The ACM SIGCHI curriculum framework places the interaction in a wider context.", "<b>Use and context<\/b>: social organisation and work, application areas, human-machine fit and adaptation.", "<b>Human<\/b>: human information processing, language and communication, ergonomics.", "<b>Computer<\/b>: input and output devices, dialog techniques and genre, computer graphics, dialog architecture.", "<b>Development process<\/b>: design approaches, implementation techniques, evaluation, example systems.", "Unlike the interaction framework it adds organisational and social context and the design process."], "src": "D"}, {"n": 22, "u": "1", "s": "1.3 The Interaction", "q": "What are five human health issues for HCI to consider? (p. 135 of HCI)", "k": ["displays", "five human health issues", "health", "health issues", "performance"], "a": ["<b>Physical position<\/b>: reach controls and see displays without strain.", "<b>Temperature<\/b>: extremes reduce performance.", "<b>Lighting<\/b>: avoid glare and low light.", "<b>Noise<\/b>: keep at a comfortable level.", "<b>Time<\/b>: limit time spent at the system (rest breaks)."], "src": "D"}, {"n": 23, "u": "1", "s": "1.3 The Interaction", "q": "List several interface styles and briefly define dialog. (pp. 136 to 137 of HCI)", "k": ["dialog", "interface styles", "menus", "spreadsheet", "users", "WIMP"], "a": ["Styles: command line; menus; natural language; question-answer and query dialog; form-fills and spreadsheets; WIMP; point-and-click; three-dimensional interfaces.", "<b>Dialog<\/b>: the structured exchange of instructions and information between user and system (the conversation in which the user states what they want and the system responds)."], "src": "D"}, {"n": 24, "u": "1", "s": "1.3 The Interaction", "q": "Briefly describe eight elements of the WIMP interface. (pp. 145 to 152 of HCI)", "k": ["dialog", "eight elements", "menus", "WIMP", "WIMP interface"], "a": ["<b>Windows<\/b>: independent screen areas with title, scrollbars, resize controls.", "<b>Icons<\/b>: small pictures for windows, files or actions.", "<b>Pointers<\/b>: on-screen cursor showing mouse position; shape shows mode.", "<b>Menus<\/b>: lists of options (pull-down, pop-up, pin-up, cascading).", "<b>Buttons<\/b>: screen regions clicked to invoke an action (radio, check).", "<b>Toolbars<\/b>: rows of small buttons for common actions.", "<b>Palettes<\/b>: mode selectors, e.g. drawing tools.", "<b>Dialog boxes<\/b>: windows for information or a needed response (often modal)."], "src": "D"}, {"n": 25, "u": "1", "s": "1.3 The Interaction", "q": "Describe a WIMP interface that you use (open question).", "k": ["dialog", "menus", "recognition", "WIMP", "WIMP interface"], "a": ["Example: Microsoft Word on Windows.", "Windows: each document in its own window; Icons: file and toolbar icons; Pointer: I-beam over text, arrow over menus; Menus: ribbon tabs and right-click context menus; Buttons and toolbars: Save, Bold, Undo; Palettes: styles gallery; Dialog boxes: Print and Find-Replace.", "Comment on strengths (recognition, direct feedback) and weaknesses (ribbon hides commands)."], "src": "O"}, {"n": 26, "u": "1", "s": "1.3 The Interaction", "q": "Describe the role of pre-emptive components in an interface oriented towards user initiation. (pp. 152 to 154 of HCI)", "k": ["dialog", "pre-emptive", "pre-emptive components", "user initiation", "users"], "a": ["In a user-initiated (user in control) interface, pre-emptive components such as <b>modal dialog boxes<\/b> stop all other interaction until the user responds.", "They are useful to prevent serious errors (confirm delete, unsaved changes) and to force attention to critical information.", "But they take control from the user and break the user's flow, so they should be used sparingly and only where the decision really must come first."], "src": "D"}, {"n": 27, "u": "1", "s": "1.3 The Interaction", "q": "How can the design of the human-computer interface affect motivation? (pp. 154 to 155 of HCI)", "k": ["design", "human-computer interface", "motivation", "users"], "a": ["Poor design (confusing, slow, error messages that blame the user) frustrates and demotivates; users give up or avoid the system.", "Good design makes the experience engaging: aesthetics, a sense of progress and control, feedback that rewards action.", "Dix's discussion of experience, engagement and fun: value must outweigh the cost of use, especially where use is voluntary.", "Highly motivated users tolerate poor design, so designers must not judge a design by enthusiastic early users."], "src": "D"}, {"n": 28, "u": "1", "s": "1.3 The Interaction", "q": "Why do some researchers add the criterion satisfaction to their consideration of usability? (p. 156 of HCI)", "k": ["satisfaction", "usability", "users"], "a": ["Efficiency and effectiveness alone do not predict whether people will use a system.", "Satisfaction (comfort, acceptability, enjoyment) shapes whether users adopt the system, especially for voluntary or leisure use.", "ISO 9241-11 defines usability as effectiveness, efficiency and <b>satisfaction<\/b>.", "Attention to user experience and fun recognises that people care how a system feels, not just what it does."], "src": "D"}, {"n": 29, "u": "1", "s": "1.3 Ex 3.1", "q": "Ex 3.1: Choose two of the interface styles (Section 3.5) that you have experience of using. Use the interaction framework to analyze the interaction involved in using these interface styles for a database selection task. Which of the distances is greatest in each case?", "k": ["database selection task", "interaction framework", "interface styles", "observation", "performance", "users"], "a": ["Example: select library records (books by Alan Dix since 1990) using natural language versus a command line.", "Natural language: <b>performance<\/b> distance greatest (system must translate a free-form query); presentation distance also large.", "Command line: <b>articulation<\/b> distance greatest (limited vocabulary makes the query hard to phrase); observation distance larger.", "Overall: natural language is easier for the user and harder for the builder; command languages are the reverse.", "The analysis is informal: distances are judged, not measured."], "src": "W"}, {"n": 30, "u": "1", "s": "1.3 Ex 3.2", "q": "Ex 3.2: Find out all you can about natural language interfaces. Are there any successful systems? For what applications are these most appropriate?", "k": ["menus", "natural language interfaces", "users"], "a": ["Dix's note: there are no general-purpose natural language interfaces; successful systems work in very constrained domains.", "Successful constrained examples: database query front ends, travel and banking voice menus, voice assistants (timers, music, weather), chatbots for FAQ support.", "Most appropriate: casual or infrequent users, hands-busy or eyes-busy settings, narrow domains with predictable vocabulary.", "Problems: ambiguity, vagueness, users overestimate what the system understands, recovery from misunderstanding is hard."], "src": "O"}, {"n": 31, "u": "1", "s": "1.3 Ex 3.3", "q": "Ex 3.3: What influence does the social environment in which you work have on your interaction with the computer? What effect does the organization (commercial or academic) to which you belong have on the interaction?", "k": ["experimentation", "motivation", "social environment", "users"], "a": ["Work context: is the machine or workplace shared?", "Peer pressure: pressure to compete or impress.", "Management pressure: pressure to achieve, or working in front of managers.", "Motivation: what drives the work and whether experimentation is encouraged.", "Organisational goals (profit vs education) and who chooses the systems (does the user have a say?).", "Compare how it would change on a personal machine. See chapters 13 and 14."], "src": "W"}, {"n": 32, "u": "1", "s": "1.3 Ex 3.4", "q": "Ex 3.4: (a) Group a list of ~50 word-processing functions (save, save as, new, undo, bold, print preview, find word, check spelling, help, ...) under menu headings. (b) Ask someone else to group them under your headings; compare. Why do some functions always group together? Why are some easy to place, others hard? Why is this important?", "k": ["help", "menu headings", "menus", "users", "word-processing functions"], "a": ["Typical headings: File, Edit, View, Insert, Format, Tools, Help.", "Some functions always group (save/save as/open/close/print) because they act on the same object (the whole file) and match users' mental model and familiar applications.", "Some are always placed correctly because the name and the heading share an obvious concept (bold under Format).", "Hard ones (glossary, repaginate, preferences, show alternative document) cut across categories or use unfamiliar terms.", "Importance: menu structure must match users' categories, or they search the wrong menu; this is what card sorting tests.", "Site labels this open-ended; no model answer."], "src": "O"}, {"n": 33, "u": "1", "s": "1.3 Ex 3.5", "q": "Ex 3.5: Using your groupings from 3.4, count items per menu. (a) Average? Disadvantage of all functions on screen at once? Problem with lots of headings? With very few? 3 big menus or 8 smaller ones: which is easier and why? (b) Optional: design an experiment to test this.", "k": ["design", "experiments", "items per menu", "menus", "within-subjects"], "a": ["Average depends on your 3.4 answer.", "All functions on screen at once: uses too much screen space, leaving little for work.", "Too many headings: hard to decide which one holds a command.", "Too few headings: long menus that slow visual search and selection (Fitts' law).", "Preference: more, smaller menus, provided categories have clear conceptual boundaries.", "(b) Experiment: within-subjects, 3-menu vs 8-menu versions, measure time to find commands and errors, counterbalance order."], "src": "W"}, {"n": 34, "u": "1", "s": "1.3 Ex 3.6", "q": "Ex 3.6: Describe (in words and graphically) the interaction framework. Explain how it can be used to explain problems in the dialogue between a user and a computer.", "k": ["dialogue", "interaction framework", "observation", "performance", "usability", "users"], "a": ["Draw four nodes in a cycle: User -> Input (articulation) -> System (performance) -> Output (presentation) -> User (observation).", "Each translation can fail: e.g. a command language the user cannot phrase is an articulation problem; a cryptic error code is a presentation/observation problem; an input with no matching operation is a performance problem.", "So the framework locates where in the cycle a usability problem sits and suggests the fix. Tutor-only on site."], "src": "O"}, {"n": 35, "u": "1", "s": "1.3 Ex 3.7", "q": "Ex 3.7: Describe briefly four different interaction styles used to accommodate the dialog between user and computer.", "k": ["dialog", "experts", "four different interaction styles", "interaction styles", "menus", "recognition", "spreadsheet", "users", "WIMP"], "a": ["Command line: typed commands; powerful and fast for experts, high recall load.", "Menus: options shown and selected; recognition rather than recall; slower for experts.", "Form-fill: fields filled like a paper form; familiar, good for data entry.", "WIMP / direct manipulation: windows, icons, menus, pointer; visible objects acted on directly with immediate feedback.", "Also: natural language, question-answer, spreadsheets, 3D. Tutor-only on site."], "src": "O"}, {"n": 36, "u": "1", "s": "1.3 Ex 3.8", "q": "Ex 3.8: What does WIMP stand for? The desktop metaphor helps users predict outcomes, but metaphors break down: what is the real-world equivalent of formatting a disk? Is there a direct analogy for undo? Think of more examples.", "k": ["desktop metaphor", "formatting a disk", "help", "menus", "metaphor", "metaphors", "users", "WIMP"], "a": ["WIMP = windows, icons, menus and pointers.", "Formatting a disk has no real desk equivalent (perhaps shredding every page and replacing the drawer).", "Undo has no direct physical analogy: you cannot unspill coffee.", "More breakdowns: dragging a disk icon to the trash to eject it; one file in two folders (shortcuts); copy-paste duplicating paper perfectly.", "Open-ended on site."], "src": "O"}, {"n": 37, "u": "1", "s": "1.4 Paradigms", "q": "What are the two open questions for designers of interactive systems? (p. 165 of HCI)", "k": ["interactive systems", "two open questions", "usability"], "a": ["How can an interactive system be developed to ensure its usability?", "How can the usability of an interactive system be demonstrated or measured?"], "src": "D"}, {"n": 38, "u": "1", "s": "1.4 Paradigms", "q": "What does the term paradigm mean in the context of developing an approach to answer these two questions? (p. 165 of HCI)", "k": ["design", "paradigm"], "a": ["A paradigm is an example of a successful interactive system (or class of systems) that serves as a model for building new ones.", "Following paradigms is one approach: design by copying what worked; the other approach is principles, derived from theory, which say why it worked."], "src": "D"}, {"n": 39, "u": "1", "s": "1.4 Paradigms", "q": "List and summarize the 15 paradigms identified by the authors. (pp. 165 to 186 of HCI)", "k": ["15 paradigms", "context-aware", "displays", "Engelbart", "hypertext", "metaphor", "multi-modality", "Nelson", "paradigm", "paradigms", "Shneiderman", "toolkits", "users", "video", "Weiser", "WIMP"], "a": ["1 Time sharing: many users share one computer interactively.", "2 Video display units: screens instead of paper teletype output.", "3 Programming toolkits: Engelbart's tools to augment human intellect.", "4 Personal computing: one person, one machine (Alto, Logo for children).", "5 Window systems and WIMP: many tasks at once in windows.", "6 Metaphor: familiar real-world knowledge (desktop) teaches new concepts.", "7 Direct manipulation: visible objects, physical actions, rapid reversible feedback (Shneiderman).", "8 Language versus action: user commands an agent vs acts directly.", "9 Hypertext: non-linear linked text (Memex, Nelson).", "10 Multi-modality: several human channels at once.", "11 Computer-supported cooperative work: groups working through computers.", "12 The World Wide Web: global hypertext.", "13 Agent-based interfaces: software agents act for the user.", "14 Ubiquitous computing: computing everywhere and invisible (Weiser).", "15 Sensor-based and context-aware interaction: implicit input from sensors."], "src": "D"}, {"n": 40, "u": "1", "s": "1.4 Paradigms", "q": "What are some criticisms of the practice of using metaphors in computer interfaces? (p. 170 of HCI)", "k": ["culture", "metaphor", "metaphors", "users"], "a": ["Metaphors can be taken too literally, so users expect the system to behave exactly like the real object and are confused when it does not.", "They break down (trash used to eject a disk) and can mislead.", "They can restrict functionality to what the metaphor allows, wasting what computers can do.", "They are culturally biased: a metaphor familiar to one culture may mean nothing to another.", "They can hinder learning of the system's real underlying model."], "src": "D"}, {"n": 41, "u": "1", "s": "1.4 Paradigms", "q": "Create a web page biography of a figure in the history of HCI (e.g. Engelbart, Sutherland, Bush, Nelson, Kay, Weiser), with at least one picture, focusing on their contribution to HCI.", "k": ["Bush", "Engelbart", "history", "history of HCI", "hypertext", "Kay", "Nelson", "Sutherland", "video", "web page biography", "Weiser"], "a": ["Good subject: Douglas Engelbart. Key points: Augmenting Human Intellect (1962); invented the mouse; 1968 'Mother of All Demos' showed hypertext, windows, video conferencing, collaborative editing; NLS system.", "Others: Vannevar Bush (Memex, 1945), Ivan Sutherland (Sketchpad, 1963), Ted Nelson (hypertext, Xanadu), Alan Kay (Dynabook, Smalltalk), Mark Weiser (ubiquitous computing).", "Page structure: photo with credit, life, key work, contribution to HCI, references."], "src": "O"}, {"n": 42, "u": "1", "s": "1.4 Paradigms", "q": "Acknowledge all information sources used by listing and citing them in APA style.", "k": ["APA", "APA style", "information sources", "organisation"], "a": ["APA 7 reference format for a book: Dix, A., Finlay, J., Abowd, G. D., &amp; Beale, R. (2004). <i>Human-computer interaction<\/i> (3rd ed.). Pearson Prentice Hall.", "Web page: Author or Organisation. (Year, Month Day). <i>Title<\/i>. Site Name. URL", "In-text: (Dix et al., 2004) or Dix et al. (2004).", "Credit images too (photographer, source, licence)."], "src": "O"}, {"n": 43, "u": "2", "s": "2.1 Interaction Design Basics", "q": "What is the golden rule of design?", "k": ["design", "golden rule of design", "materials"], "a": ["<b>Understand your materials.<\/b>", "For HCI the materials are the human and the computer: their capabilities, limitations and how they behave."], "src": "D"}, {"n": 44, "u": "2", "s": "2.1 Interaction Design Basics", "q": "What are the 'materials' of HCI? (pp. 193 to 194 of HCI)", "k": ["materials"], "a": ["<b>Computers<\/b>: limitations, capacities, tools and platforms.", "<b>People<\/b>: psychological and social aspects, and human error.", "Designing without understanding them is like building with materials whose strength you do not know."], "src": "D"}, {"n": 45, "u": "2", "s": "2.1 Interaction Design Basics", "q": "Give one reason why iteration and prototyping are important in design. (p. 196 of HCI)", "k": ["design", "iteration", "prototyping", "users"], "a": ["You will never get it right first time: users' needs cannot be fully known in advance and only appear when people try a design, so you must build, test with users and refine."], "src": "D"}, {"n": 46, "u": "2", "s": "2.1 Interaction Design Basics", "q": "What is a persona? (p. 201 of HCI)", "k": ["design", "persona", "users"], "a": ["A rich description of a typical user of the system, a fictional but realistic person with name, background, goals and context.", "It keeps the design team thinking about real users and can stand for a user class when real users are not available."], "src": "D"}, {"n": 47, "u": "2", "s": "2.1 Interaction Design Basics", "q": "What are three uses of scenarios? (p. 203 of HCI)", "k": ["scenario", "scenarios", "three uses of scenarios", "users"], "a": ["<b>Communication<\/b> with others: designers, clients, users.", "<b>Validating other models<\/b>: dry-running a scenario against a task model or specification.", "<b>Expressing dynamics<\/b>: showing behaviour over time, which screen shots and specifications cannot."], "src": "D"}, {"n": 48, "u": "2", "s": "2.1 Interaction Design Basics", "q": "What are the issues or concerns of local structure? (pp. 203 to 208 of HCI)", "k": ["local structure", "users"], "a": ["At each screen the user needs to know: <b>where am I?<\/b>; <b>what can I do here?<\/b>; <b>where can I go?<\/b> (and what will happen); <b>where have I been<\/b> / what have I done.", "Goal seeking: users find their way by small steps towards a goal, so each screen must make progress visible.", "Icons and labels must be clear; modes should be visible."], "src": "D"}, {"n": 49, "u": "2", "s": "2.1 Interaction Design Basics", "q": "What is the argument for and against deep hierarchy? (p. 209 of HCI)", "k": ["deep hierarchy", "experiments", "hierarchy", "memory", "menus"], "a": ["For deep (narrow) hierarchies: each menu is short, in line with the 7 plus or minus 2 short-term memory limit.", "Against: the 7 plus or minus 2 rule is misapplied, because a visible menu is not held in memory; experiments show broad shallow hierarchies are faster and cause fewer errors, since every extra level is another decision and a chance to get lost."], "src": "D"}, {"n": 50, "u": "2", "s": "2.1 Interaction Design Basics", "q": "Define affordance and give an example in which the affordance depends upon computer literacy. (pp. 216 to 217 of HCI)", "k": ["affordance", "computer literacy"], "a": ["Affordance: the properties of an object, as perceived, that suggest how it can be used (a handle affords pulling, a button affords pushing).", "Many screen affordances are learned: a shaded 3D rectangle affords clicking, blue underlined text affords following a link, a scrollbar affords dragging; to someone who has never used a computer these suggest nothing."], "src": "D"}, {"n": 51, "u": "2", "s": "2.1 Interaction Design Basics", "q": "What are the two things that need to be done in order for prototyping to work? (p. 221 of HCI)", "k": ["design", "evaluation", "iteration", "prototyping"], "a": ["You need to understand <b>what is wrong and how to improve it<\/b> (good evaluation and diagnosis).", "You need a <b>good starting point<\/b>, since iteration only finds a local optimum and a poor initial design cannot be fixed by tweaking."], "src": "D"}, {"n": 52, "u": "2", "s": "2.1 Ex 5.1", "q": "Ex 5.1: Use a pocket alarm clock or wristwatch to set yourself alarms every 15 minutes one working day. Write down exactly what you are doing. How surprising is it?", "k": ["design", "pocket alarm clock", "scenario", "users", "wristwatch"], "a": ["Most people find that what they actually do differs from what they think they do: many short, interrupted activities, task switching, waiting, informal talk.", "Lessons: self-reports are unreliable, so observe users; design for interruption and resumption; scenarios should reflect real fragmented work.", "Tutor-only on site."], "src": "O"}, {"n": 53, "u": "2", "s": "2.2 HCI in Software Process", "q": "What is the most important point to remember regarding HCI issues in the software design cycle? (p. 226 of HCI)", "k": ["design", "software design cycle", "usability"], "a": ["Usability must be addressed <b>throughout<\/b> the whole design life cycle, not added at the end as a test or a finish."], "src": "D"}, {"n": 54, "u": "2", "s": "2.2 HCI in Software Process", "q": "List and briefly describe the six main activities of the software life cycle (waterfall) model. (pp. 227 to 233 of HCI)", "k": ["design", "six main activities", "software life cycle", "testing", "waterfall"], "a": ["<b>Requirements specification<\/b>: what the system must do (from customer and designer).", "<b>Architectural design<\/b>: decompose into components and how they connect.", "<b>Detailed design<\/b>: refine each component so it can be coded.", "<b>Coding and unit testing<\/b>: implement and test components.", "<b>Integration and testing<\/b>: combine and test the whole, including acceptance.", "<b>Maintenance<\/b>: fix and change after release (the longest phase)."], "src": "D"}, {"n": 55, "u": "2", "s": "2.2 HCI in Software Process", "q": "What are the shortcomings in the traditional software cycle in regard to ensuring usability? (pp. 235 to 237 of HCI)", "k": ["design", "iteration", "prototyping", "traditional software cycle", "usability", "users"], "a": ["Requirements for usability cannot be fully stated at the start; users' needs are discovered by using a design.", "Users are involved only at the start and at acceptance, so problems surface late when they are expensive to fix.", "The linear model has no formal iteration, yet interface design needs repeated prototyping.", "Verification checks the product against the specification, but a correct product may still be unusable (validation is hard to formalise)."], "src": "D"}, {"n": 56, "u": "2", "s": "2.2 HCI in Software Process", "q": "What is a problem in usability engineering? (pp. 240 to 241 of HCI)", "k": ["design", "evaluation", "usability", "usability engineering", "users"], "a": ["Usability specifications rely on measuring very specific user actions in very specific situations; meeting those measures does not guarantee the system is usable overall.", "Measures also need early access to something measurable, and designers may not know which attributes matter.", "So usability engineering supports, but does not replace, design and evaluation with users."], "src": "D"}, {"n": 57, "u": "2", "s": "2.2 HCI in Software Process", "q": "What are the three techniques for prototyping? Briefly describe the characteristics of each of them. (pp. 244 to 247 of HCI)", "k": ["prototyping", "three techniques for prototyping"], "a": ["<b>Throw-away<\/b>: built to learn requirements, then discarded; the final system is built properly.", "<b>Incremental<\/b>: the final product is built as separate components, one at a time, each added to the delivered system.", "<b>Evolutionary<\/b>: the prototype is not discarded but grows into the final system."], "src": "D"}, {"n": 58, "u": "2", "s": "2.2 HCI in Software Process", "q": "What differentiates process-oriented design rationales from structure-oriented design rationales? (pp. 255 to 256 of HCI)", "k": ["design", "history", "process-oriented design rationales", "QOC", "structure-oriented design rationales"], "a": ["<b>Process-oriented<\/b> (e.g. IBIS, gIBIS): records the history of design decisions as they were deliberated: issues, positions, arguments.", "<b>Structure-oriented<\/b> (e.g. QOC, Design Space Analysis): organises the design space after the fact (post hoc): Questions, Options, Criteria, so alternatives can be compared."], "src": "D"}, {"n": 59, "u": "2", "s": "2.2 Ex 6.1", "q": "Ex 6.1 (a): How can design rationale benefit interface design and why might it be rejected by design teams?", "k": ["design", "design rationale", "design teams", "evaluation", "interface design", "reasoning"], "a": ["Benefits: records why decisions were made, aiding later maintenance and reuse; communicates among designers; forces consideration of alternatives and criteria (better decisions); supports evaluation and future redesign; for HCI it captures the psychological reasons behind design choices.", "Reasons for rejection: time and cost to record; slows a fast-moving team; hard to capture tacit reasoning; designers dislike exposing rejected ideas; benefit appears later and to other people.", "Tutor-only on site."], "src": "O"}, {"n": 60, "u": "2", "s": "2.2 Ex 6.1", "q": "Ex 6.1 (b): Explain QOC design rationale using an example to illustrate.", "k": ["design", "learnability", "QOC", "QOC design rationale", "users"], "a": ["QOC (MacLean et al.) = Questions, Options, Criteria.", "Question: 'How should the user confirm a money transfer?'", "Options: (1) single confirm button; (2) review screen then confirm; (3) type the amount again.", "Criteria: speed, error prevention, learnability.", "Assessments: (1) fast, weak on error prevention; (2) balanced; (3) strongest error prevention, slowest.", "Chosen option (2) with arguments recorded; consequent questions follow (what if the user goes back to edit?).", "Tutor-only on site."], "src": "O"}, {"n": 61, "u": "2", "s": "2.3 Design Rules", "q": "List the key components of learnability, flexibility, and robustness. (pp. 260 to 275 of HCI)", "k": ["consistency", "dialog", "flexibility", "learnability", "robustness", "synthesizability"], "a": ["<b>Learnability<\/b>: predictability, synthesizability, familiarity, generalizability, consistency.", "<b>Flexibility<\/b>: dialog initiative, multi-threading, task migratability, substitutivity, customizability (adaptivity and adaptability).", "<b>Robustness<\/b>: observability, recoverability, responsiveness, task conformance."], "src": "D"}, {"n": 62, "u": "2", "s": "2.3 Design Rules", "q": "How does the applicability of standards differ for hardware and software? (p. 275 of HCI)", "k": ["cognition", "ergonomics", "hardware and software", "psychology", "standards"], "a": ["Hardware standards rest on physiology and ergonomics, which are well understood and stable, so they can be specific and authoritative (e.g. key spacing, screen glare).", "Software standards rest on psychology and cognition, which are less understood, and software changes fast, so standards are more general and interpretive."], "src": "D"}, {"n": 63, "u": "2", "s": "2.3 Design Rules", "q": "What is the purpose of a style guide? (p. 280 of HCI)", "k": ["guidelines", "organisation", "style guide", "toolkits"], "a": ["To give a consistent look and feel across applications on one platform or within one organisation (e.g. Apple Human Interface Guidelines, Windows guidelines).", "It turns general guidelines into concrete rules for that environment and is often supported by the toolkit."], "src": "D"}, {"n": 64, "u": "2", "s": "2.3 Design Rules", "q": "List Shneiderman's eight golden rules of interface design.", "k": ["consistency", "design", "dialog", "golden rules", "interface design", "memory", "Shneiderman", "Shneidermans eight golden rules", "users"], "a": ["1 Strive for consistency.", "2 Enable frequent users to use shortcuts.", "3 Offer informative feedback.", "4 Design dialogs to yield closure.", "5 Offer error prevention and simple error handling.", "6 Permit easy reversal of actions.", "7 Support internal locus of control.", "8 Reduce short-term memory load."], "src": "D"}, {"n": 65, "u": "2", "s": "2.3 Design Rules", "q": "List Norman's seven principles for transforming difficult tasks into simple ones. (pp. 282 to 284 of HCI)", "k": ["design", "difficult tasks", "evaluation", "gulfs", "Norman", "Normans seven principles"], "a": ["1 Use both knowledge in the world and knowledge in the head.", "2 Simplify the structure of tasks.", "3 Make things visible: bridge the gulfs of execution and evaluation.", "4 Get the mappings right.", "5 Exploit the power of constraints, both natural and artificial.", "6 Design for error.", "7 When all else fails, standardize."], "src": "D"}, {"n": 66, "u": "2", "s": "2.3 Design Rules", "q": "What features characterize HCI patterns from other design rules? (p. 285 of HCI)", "k": ["design", "design rules", "HCI patterns", "patterns", "stakeholders", "standards"], "a": ["Patterns capture design practice, not theory: they come from successful real solutions.", "They capture the essential common properties of good design, in a standard form (name, context, problem, forces, solution, examples).", "They represent design knowledge at varying levels, from social and organisational to detailed widget design.", "They embody values and say what is humane and good, not just what works.", "They are intuitive and readable, so they serve communication among all stakeholders.", "They are generative and linked into pattern languages (one pattern leads to others)."], "src": "D"}, {"n": 67, "u": "2", "s": "2.3 Ex 7.1", "q": "Ex 7.1: What was the problem with the synthesis example comparing a command language interface with a visual interface? Can you suggest a fix to make a visual interface really immediately honest?", "k": ["command language interface", "honesty", "immediately honest", "visual interface"], "a": ["The text claims visual file managers show a moved file's new location immediately; this is a fallacy.", "Moving a file into a closed folder shows nothing about where it went until the folder is opened: <b>eventual<\/b> honesty, not immediate honesty.", "Fix 1: require the destination folder to be open (too restrictive on screen space).", "Fix 2: open the destination temporarily to show the file arriving; tricky, as it must not cover the source folder."], "src": "W"}, {"n": 68, "u": "2", "s": "2.3 Ex 7.2", "q": "Ex 7.2: If consistency were a major category of interactive principles alongside learnability, flexibility and robustness, which principles would appear in support of consistency?", "k": ["affordance", "consistency", "flexibility", "history", "interactive principles", "layout", "learnability", "robustness", "users"], "a": ["Familiarity: consistency with real-world experience.", "Generalizability: consistency with other parts of the system and platform.", "Affordance: consistency with an object's intrinsic properties.", "Predictability: response matches expectation from history.", "Substitutivity: equivalent values usable for input and output.", "Commensurate effort: consistent effort to do and undo.", "Response time stability.", "Also: consistency of input form with the user's model (arrow-key layout) and with cultural conventions (red = stop)."], "src": "W"}, {"n": 69, "u": "2", "s": "2.4 Universal Design", "q": "Why should we not assume a 'typical' user is like us? (p. 366 of HCI)", "k": ["culture", "typical user", "users"], "a": ["Users vary widely in ability, age, culture, language, experience and situation; designers are not representative (more technical, younger, able-bodied).", "Designing for ourselves excludes many people, including those with disabilities, and leads to systems that fail real users."], "src": "D"}, {"n": 70, "u": "2", "s": "2.4 Universal Design", "q": "What are the seven principles of universal design? (pp. 366 to 368 of HCI)", "k": ["design", "flexibility", "seven principles of universal design", "universal design"], "a": ["1 Equitable use.", "2 Flexibility in use.", "3 Simple and intuitive use.", "4 Perceptible information.", "5 Tolerance for error.", "6 Low physical effort.", "7 Size and space for approach and use."], "src": "D"}, {"n": 71, "u": "2", "s": "2.4 Universal Design", "q": "What is multi-modal interaction? What advantages might it have? (pp. 368 to 369 of HCI)", "k": ["multi-modal", "multi-modal interaction", "recognition", "sound", "speech"], "a": ["Interaction that uses more than one sensory channel at once (sight, sound, touch, and potentially smell or taste), e.g. speech plus gesture, or visual plus audio feedback.", "Advantages: redundancy (message gets through if one channel fails); access for people who cannot use one channel; reduced load on a busy channel (eyes on the road); richer, more natural interaction; better recognition when combined inputs disambiguate each other."], "src": "D"}, {"n": 72, "u": "2", "s": "2.4 Universal Design", "q": "What are three levels of speech in speech interaction? (p. 375 of HCI)", "k": ["recognition", "sound", "speech", "speech interaction", "stress", "three levels of speech"], "a": ["Dix describes the structure of speech as: <b>phonemes<\/b> (basic distinct sounds, about 40 in English); <b>allophones<\/b> (the actual sounds as pronounced, varying by context, about 120 to 130); <b>morphemes<\/b> (smallest units of meaning).", "Prosody (pitch, stress, rhythm) carries further meaning.", "[Check against p. 375: an alternative reading is the three uses: speech recognition, speech synthesis and uninterpreted speech.]"], "src": "D"}, {"n": 73, "u": "2", "s": "2.4 Universal Design", "q": "What is an auditory icon? (pp. 376 to 377 of HCI)", "k": ["auditory icon", "sound"], "a": ["A natural, everyday sound used to represent an object or action in the interface, e.g. crumpled paper for emptying the trash.", "Gaver's SonicFinder used sounds whose properties carry information (a larger file makes a deeper sound when dragged)."], "src": "D"}, {"n": 74, "u": "2", "s": "2.4 Universal Design", "q": "What is an earcon? (p. 378 of HCI)", "k": ["earcon"], "a": ["A synthetic, abstract musical motif (pitch, rhythm, timbre, register) used to represent objects or actions.", "Compound earcons combine motifs (create + file); hierarchical earcons inherit features down a family.", "Unlike auditory icons they have no natural meaning and must be learned."], "src": "D"}, {"n": 75, "u": "2", "s": "2.4 Universal Design", "q": "What is the problem of co-articulation in handwriting recognition? (pp. 382 to 383 of HCI)", "k": ["co-articulation", "handwriting", "handwriting recognition", "recognition"], "a": ["In joined (cursive) writing the shape of a letter changes depending on the letters before and after it, and letters run together.", "So the recogniser cannot easily segment and identify individual characters; combined with differences between writers this makes recognition hard."], "src": "D"}, {"n": 76, "u": "2", "s": "2.4 Universal Design", "q": "What is the challenge of designing for an 'average' user? (pp. 384, 390 to 392 of HCI)", "k": ["average user", "culture", "diversity", "layout", "navigation", "speech", "users"], "a": ["There is no average user: designing for the mean fits almost nobody.", "Diversity includes disability (visual, hearing, physical, speech, dyslexia, autism), age (older adults, children) and culture (language, symbols, colour meanings, gestures, layout direction).", "Designers should include the range, e.g. older users need larger text and simpler navigation; children need different input; cultural differences change the meaning of icons and colours."], "src": "D"}, {"n": 77, "u": "2", "s": "2.4 Ex 10.1", "q": "Ex 10.1: Is multi-modality always a good thing? Justify your answer.", "k": ["accessibility", "multi-modality", "recognition", "sound", "speech", "users"], "a": ["Not always.", "Benefits: redundancy, accessibility, richer interaction, frees overloaded channels.", "Costs: modes can conflict and overload the user (sound plus text plus vibration), sound annoys others and is not private, extra channels add cost and complexity, inconsistent cues across modes confuse, recognition errors in speech or gesture add new failure points.", "Good when each mode adds information or access; bad when added for novelty. Tutor-only on site."], "src": "O"}, {"n": 78, "u": "2", "s": "2.4 Ex 10.2", "q": "Ex 10.2: What are (i) auditory icons and (ii) earcons? How can they be used to benefit both visually-impaired and sighted users?", "k": ["auditory icons", "awareness", "earcon", "earcons", "sighted users", "sound", "users", "visually-impaired"], "a": ["(i) Auditory icons: natural sounds mapped to objects and actions (crumpling paper for delete).", "(ii) Earcons: learned synthetic musical motifs for objects and actions.", "Visually impaired users: sounds convey interface events and object types that would otherwise be visual only (screen-reader supplements).", "Sighted users: background awareness without looking (download finished, error, new mail); reduces visual load; useful when eyes are busy. Tutor-only on site."], "src": "O"}, {"n": 79, "u": "3", "s": "3.1 Implementation Tools", "q": "What is the aim of programming support tools? (p. 290 of HCI)", "k": ["consistency", "design", "dialog", "help", "implementation", "programming support tools", "users"], "a": ["To help the programmer turn the interactive design into an implementation by raising the level of abstraction, so the programmer works in terms closer to the user's view of interaction (windows, widgets, dialogs) rather than raw hardware.", "They also help enforce design principles such as consistency."], "src": "D"}, {"n": 80, "u": "3", "s": "3.1 Implementation Tools", "q": "Explain how windowing systems support simultaneous user tasks. (pp. 291 to 292 of HCI)", "k": ["simultaneous user tasks", "users", "windowing systems"], "a": ["Each application runs in its own window, an abstract terminal, so several tasks are visible and active at once.", "The window system shares the physical screen, keyboard and mouse among the applications and routes input to the right one (resource sharing).", "It also gives device independence: applications draw to a window, not the specific hardware."], "src": "D"}, {"n": 81, "u": "3", "s": "3.1 Implementation Tools", "q": "What is the advantage of client/server architecture for windows? (pp. 292 to 293 of HCI)", "k": ["architecture", "client/server architecture", "displays"], "a": ["A single server manages the display hardware; applications are clients that send requests to it (e.g. X Window System).", "Advantages: clients can run on different machines across a network (network transparency); device independence; consistent management of shared resources; many clients can share one display."], "src": "D"}, {"n": 82, "u": "3", "s": "3.1 Implementation Tools", "q": "How is a pre-emptive event potentially more complex to handle if you are using a system oriented towards notification? (p. 301 of HCI)", "k": ["dialog", "notification", "pre-emptive", "pre-emptive event", "users"], "a": ["In a read-evaluate loop the application controls the dialog, so it can simply ignore other events until the user responds.", "In a notification-based system control lies with the notifier, which passes each event to registered callbacks; the application cannot just wait.", "To pre-empt, the application must tell the notifier to change its behaviour (e.g. route all events to one dialog, discard others), which breaks the simple callback model and adds complexity."], "src": "D"}, {"n": 83, "u": "3", "s": "3.1 Implementation Tools", "q": "What is one basic advantage of a toolkit approach to HCI programming? (p. 303 of HCI)", "k": ["HCI programming", "toolkit approach", "toolkits"], "a": ["Toolkits provide interaction objects (widgets) that combine input and output behaviour, so programmers build interfaces from ready components; this ensures a consistent look and feel across applications and reduces programming effort."], "src": "D"}, {"n": 84, "u": "3", "s": "3.1 Implementation Tools", "q": "What are three main components of a UIMS? (p. 308 of HCI)", "k": ["dialog", "lexical", "Seeheim", "semantic", "syntactic", "three main components", "UIMS"], "a": ["From the Seeheim model: <b>presentation<\/b> (the appearance and lexical level), <b>dialog control<\/b> (the structure of the conversation, syntactic level), <b>application interface model<\/b> (the view of the application semantics).", "A switch or bypass allows rapid feedback from the application directly to presentation."], "src": "D"}, {"n": 85, "u": "3", "s": "3.1 Implementation Tools", "q": "What are the features of the MVC model of interface design? (pp. 309 to 310 of HCI)", "k": ["design", "interface design", "MVC", "MVC model", "semantic", "users"], "a": ["From Smalltalk: <b>Model<\/b> = application semantics and data; <b>View<\/b> = graphical output; <b>Controller<\/b> = user input.", "Each model can have several view-controller pairs (multiple views of the same data stay consistent).", "Separates input from output; the controller changes the model, the model notifies views to redraw.", "Compare PAC (presentation, abstraction, control), which groups input and output together and adds explicit control."], "src": "D"}, {"n": 86, "u": "3", "s": "3.1 Ex 8.1", "q": "Ex 8.1: How would a programmer describe a pre-emptive dialog by purely graphical means? (Hint: Section 8.5, the shift from external dialog management to presentation control.)", "k": ["dialog", "external dialog management", "graphical means", "pre-emptive", "pre-emptive dialog", "presentation control", "users"], "a": ["In graphics-based interaction the user can only interact with visible parts of the system.", "Create a window that covers the whole screen and make it the selected window.", "All input then goes to that window, so the user cannot select another one.", "The covering window pre-empts every other action except those it supports."], "src": "W"}, {"n": 87, "u": "3", "s": "3.1 Ex 8.2", "q": "Ex 8.2: Using the font characteristics STN of Chapter 16, compare different interaction objects that could implement this dialog (pull-down menus, dialog boxes, or a novel object).", "k": ["dialog", "dialog boxes", "font characteristics", "interaction objects", "menus", "pull-down menus", "STN", "synthesizability"], "a": ["Task: toggle bold, italic and underline.", "Pull-down menu: one change per invocation; to check status you must reopen the menu, so state is not immediately visible (weak synthesizability).", "Dialog box with checkboxes or toggle buttons: several changes in one invocation and on/off state visible.", "Permanently shown toggle buttons (toolbar) are best when space allows; a dialog box suits many characteristics with limited space."], "src": "W"}, {"n": 88, "u": "4", "s": "4.1 Evaluation", "q": "What is the ideal situation for evaluation of interactive systems? (p. 319 of HCI)", "k": ["design", "evaluation", "ideal situation", "interactive systems"], "a": ["Evaluation should not be a single phase at the end: ideally it happens throughout the design life cycle, with results feeding back into modifications of the design."], "src": "D"}, {"n": 89, "u": "4", "s": "4.1 Evaluation", "q": "What are the three main goals of evaluation? (pp. 319 to 320 of HCI)", "k": ["accessibility", "evaluation", "learnability", "satisfaction", "three main goals of evaluation", "usability", "users"], "a": ["1 Assess the <b>extent and accessibility of the system's functionality<\/b> (does it support the task?).", "2 Assess the <b>users' experience<\/b> of the interaction (learnability, usability, satisfaction).", "3 Identify <b>specific problems<\/b> with the system."], "src": "D"}, {"n": 90, "u": "4", "s": "4.1 Evaluation", "q": "What are the four requirements for performing a cognitive walkthrough and what are the four questions to ask? (pp. 321 to 322 of HCI)", "k": ["cognitive walkthrough", "four requirements", "users"], "a": ["Requirements: 1 a specification or prototype of the system; 2 a description of the task the user will perform; 3 a complete written list of the actions needed to complete the task; 4 an indication of who the users are and their experience and knowledge.", "Questions at each action: 1 Is the effect of the action the same as the user's goal at that point? 2 Will users see that the action is available? 3 Once users have found the correct action, will they know it is the one they need? 4 After the action is taken, will users understand the feedback they get?"], "src": "D"}, {"n": 91, "u": "4", "s": "4.1 Evaluation", "q": "What are the ten evaluation heuristics developed by Nielsen and Molich? (pp. 324 to 326 of HCI)", "k": ["consistency", "design", "documentation", "evaluation", "flexibility", "help", "heuristics", "Nielsen", "Nielsen and Molich", "recognition", "severity", "standards", "ten evaluation heuristics", "users"], "a": ["1 Visibility of system status.", "2 Match between system and the real world.", "3 User control and freedom.", "4 Consistency and standards.", "5 Error prevention.", "6 Recognition rather than recall.", "7 Flexibility and efficiency of use.", "8 Aesthetic and minimalist design.", "9 Help users recognize, diagnose and recover from errors.", "10 Help and documentation.", "Severity ratings 0 to 4: 0 not a problem, 1 cosmetic, 2 minor, 3 major, 4 catastrophe. 3 to 5 evaluators find about 75% of problems."], "src": "D"}, {"n": 92, "u": "4", "s": "4.1 Evaluation", "q": "What are the distinctive features of each of the two main styles of evaluation? (pp. 327 to 329 of HCI)", "k": ["design", "distinctive features", "evaluation", "experiments", "laboratory", "two main styles of evaluation", "users"], "a": ["<b>Laboratory studies<\/b>: controlled conditions, specialist equipment (recording, one-way mirrors), no interruptions; good for experiments and comparing designs, but an unnatural context may change behaviour; essential for dangerous or remote settings.", "<b>Field studies<\/b>: users in their natural environment; capture real context, interruptions and long-term use; less control, more noise and distraction, harder to record."], "src": "D"}, {"n": 93, "u": "4", "s": "4.1 Evaluation", "q": "What are three critical questions for assessing the results of an experimental design? (p. 334 of HCI)", "k": ["design", "experimental design", "three critical questions"], "a": ["Is there a difference? (statistical significance)", "How big is the difference? (effect size)", "How accurate is the estimate? (confidence in the measured size)"], "src": "D"}, {"n": 94, "u": "4", "s": "4.1 Evaluation", "q": "Briefly describe methods for recording user actions. (pp. 344 to 345 of HCI)", "k": ["recording user actions", "users", "video"], "a": ["<b>Paper and pencil<\/b>: cheap, but limited by writing speed.", "<b>Audio recording<\/b>: good for think-aloud, hard to match to actions.", "<b>Video recording<\/b>: captures actions, needs several cameras and long analysis.", "<b>Computer logging<\/b>: automatic, unobtrusive, accurate timings, but huge volumes and no reasons.", "<b>User notebooks / diaries<\/b>: coarse, subjective, useful in long studies.", "Mixed media often combined and synchronised with analysis tools."], "src": "D"}, {"n": 95, "u": "4", "s": "4.1 Evaluation", "q": "Briefly describe the types of questions that can be used in a questionnaire. (pp. 349 to 350 of HCI)", "k": ["questionnaire", "semantic", "types of questions"], "a": ["<b>General<\/b>: background (age, experience, job).", "<b>Open-ended<\/b>: free answers; rich but hard to analyse.", "<b>Scalar<\/b>: rate a statement on a scale (Likert, semantic differential).", "<b>Multi-choice<\/b>: choose one or more fixed responses.", "<b>Ranked<\/b>: put options in order of preference."], "src": "D"}, {"n": 96, "u": "4", "s": "4.1 Evaluation", "q": "What is the potential benefit of evaluation through monitoring physiological responses? (p. 352 of HCI)", "k": ["evaluation", "monitoring physiological responses", "physiological responses", "stress", "users"], "a": ["It gives objective, continuous measures of what users actually look at and feel, which users may not report.", "Eye tracking: fixations, saccades and scan paths show attention and difficulty.", "Physiological measures: heart rate, skin conductance (GSR), muscle activity (EMG), brain activity (EEG) indicate stress, effort and emotional response.", "Limitation: hard to interpret what causes a reading."], "src": "D"}, {"n": 97, "u": "4", "s": "4.1 Evaluation", "q": "What are the factors to consider in choosing evaluation techniques? (pp. 357 to 360 of HCI)", "k": ["design", "evaluation", "evaluation techniques", "expertise", "implementation", "interference", "laboratory"], "a": ["1 Stage in the life cycle (design vs implementation).", "2 Style of evaluation (laboratory vs field).", "3 Level of subjectivity or objectivity.", "4 Type of measures (qualitative vs quantitative).", "5 Information provided (high level vs low level).", "6 Immediacy of response.", "7 Level of interference (intrusiveness).", "8 Resources required (equipment, time, money, expertise)."], "src": "D"}, {"n": 98, "u": "4", "s": "4.1 Ex 9.1", "q": "Ex 9.1: In groups or pairs, use the cognitive walkthrough example and what you know about user psychology (Chapter 1) to discuss the design of an application of your choice (e.g. a word processor), focusing on one or two tasks.", "k": ["cognitive walkthrough", "design", "psychology", "recognition", "user psychology", "users", "word processor"], "a": ["Pick a task, e.g. 'insert a table of contents in Word'. List the correct actions (References tab, Table of Contents, choose style).", "Ask the four questions at each step: does the step match the goal (users think 'Insert', not 'References'); is the action visible; will users recognise it; is the feedback understood.", "Link failures to psychology: recall vs recognition, mental models, mappings.", "Record problems and fixes."], "src": "O"}, {"n": 99, "u": "4", "s": "4.1 Ex 9.2", "q": "Ex 9.2: What are the benefits and problems of using video in experimentation? Transcribe a piece of action and conversation; what problems did you encounter?", "k": ["ethics", "experimentation", "speech", "video"], "a": ["Benefits: permanent, replayable record of actions, posture and speech; can be reviewed by several analysts; captures detail missed live.", "Problems: intrusive (people act differently); framing misses screen or face; synchronising with logs; huge analysis time (often 5 to 10 hours per hour); ethics and consent.", "Transcription problems: overlapping speech, non-verbal behaviour, deciding what level of detail to record."], "src": "O"}, {"n": 100, "u": "4", "s": "4.1 Ex 9.3", "q": "Ex 9.3: In Section 9.4.2 the observed results could be due to interference. Suggest alternative designs that make this less likely, keeping a within-subjects design but allowing more tests per participant.", "k": ["alternative designs", "design", "interference", "patterns", "within-subjects", "within-subjects design"], "a": ["Counterbalance order: half the participants do condition A then B, half B then A, so learning or interference effects cancel.", "Use more trials per participant in an ABBA (or ABAB) pattern, so each condition appears early and late.", "Insert breaks or distractor tasks between conditions to let interference fade.", "Use different but equivalent task sets in each condition so prior items do not interfere."], "src": "O"}, {"n": 101, "u": "4", "s": "4.1 Ex 9.4", "q": "Ex 9.4: For each situation choose an evaluation method, identifying participants, technique, representative tasks, measurements and an outline plan: (a) spreadsheet icons at an early stage; (b) theatre booking prototype; (c) new game before release; (d) group decision support for a solicitor's office; (e) two designs for a student exam results system before implementation.", "k": ["design", "ethnography", "evaluation", "evaluation method", "experiments", "experts", "games", "GOMS", "group decision support", "heuristics", "implementation", "KLM", "measurements", "observation", "plans", "questionnaire", "representative tasks", "satisfaction", "severity", "spreadsheet", "spreadsheet icons", "student exam results system", "theatre booking prototype", "users", "within-subjects"], "a": ["(a) Icons: participants = target spreadsheet users; technique = controlled experiment (icon-to-function matching and recall after delay); tasks = identify function of each icon; measures = errors, time, recall after a week; plan = paper icon sets, within-subjects, counterbalanced.", "(b) Theatre booking: theatre-goers incl. occasional users; think-aloud or cooperative evaluation on the prototype, then field trial in the foyer; tasks = find a show, choose seats, pay; measures = completion, time, errors, satisfaction questionnaire.", "(c) Game: target players; observation and logging in beta tests plus questionnaires and interviews; tasks = play levels; measures = fun ratings, where players get stuck, quitting points.", "(d) Solicitors: lawyers and staff in the office; field study / ethnography and interviews over weeks; tasks = real decision meetings; measures = use, satisfaction, effect on decisions, organisational fit.", "(e) Two exam-result designs: expert evaluation (heuristic evaluation, cognitive walkthrough) or a GOMS/KLM analysis; plus a small paper-prototype comparison with administrators; measures = predicted time, problems found by severity."], "src": "O"}, {"n": 102, "u": "4", "s": "4.1 Ex 9.5", "q": "Ex 9.5: Complete the cognitive walkthrough example for the video remote control design.", "k": ["cognitive walkthrough", "design", "displays", "users", "video", "video remote control"], "a": ["Task in the text: program the video to record a programme (start time, end time, channel, date) with the remote handset.", "Continue the remaining action steps with the four questions each time: e.g. after entering the start time, does the user know to press 'timed record' again, can they see where the end time goes, will they know the channel button is the right one, and does the display confirm the setting?", "Typical problems: no clear prompt for the next field, ambiguous button labels, feedback only on the TV screen, no confirmation that the programme is stored.", "Fixes: on-screen prompt for each step, highlighted current field, explicit 'saved' message."], "src": "O"}, {"n": 103, "u": "4", "s": "4.2 User Support", "q": "What are the four main types of assistance users require? (p. 396 of HCI)", "k": ["assistance", "four main types of assistance", "help", "users"], "a": ["<b>Quick reference<\/b>: reminder of syntax or details of a command.", "<b>Task-specific help<\/b>: how to do a particular task.", "<b>Full explanation<\/b>: in-depth understanding of a tool.", "<b>Tutorial<\/b>: step-by-step learning of the system, especially for beginners."], "src": "D"}, {"n": 104, "u": "4", "s": "4.2 User Support", "q": "What are six characteristics of good user support? (pp. 397 to 399 of HCI)", "k": ["completeness", "consistency", "flexibility", "good user support", "help", "robustness", "six characteristics", "user support", "users"], "a": ["1 <b>Availability<\/b>: available at any time during the interaction.", "2 <b>Accuracy and completeness<\/b>: describes the current version and all of it.", "3 <b>Consistency<\/b>: consistent with the system and across forms of help.", "4 <b>Robustness<\/b>: handles errors predictably.", "5 <b>Flexibility<\/b>: suits users of different levels of experience.", "6 <b>Unobtrusiveness<\/b>: does not stop the user working."], "src": "D"}, {"n": 105, "u": "4", "s": "4.2 User Support", "q": "What are five approaches to user support? (pp. 399 to 404 of HCI)", "k": ["assistance", "documentation", "five approaches to user support", "help", "user support", "users"], "a": ["<b>Command assistance<\/b>: help on a named command (e.g. UNIX man).", "<b>Command prompts<\/b>: show correct usage or options when an error occurs.", "<b>Context-sensitive help<\/b>: help related to the current object or state (tooltips).", "<b>Online tutorials<\/b>: interactive lessons in a safe environment.", "<b>Online documentation<\/b>: manuals online, searchable and hyperlinked.", "Also: wizards and assistants that walk users through a task."], "src": "D"}, {"n": 106, "u": "4", "s": "4.2 User Support", "q": "List some simple guidelines for online documentation. (p. 402 of HCI)", "k": ["documentation", "guidelines", "hypertext", "layout", "online documentation", "simple guidelines", "users"], "a": ["Do not just copy the paper manual onto the screen; rewrite for screen reading.", "Use clear, simple, consistent language and short sections.", "Organise around user tasks, with examples.", "Provide index, search and hypertext links between related topics.", "Use headings and layout so pages can be scanned.", "Keep it accurate and in step with the system version."], "src": "D"}, {"n": 107, "u": "4", "s": "4.2 User Support", "q": "What are three approaches to user modeling? (pp. 405 to 407 of HCI)", "k": ["expertise", "experts", "help", "novice", "three approaches to user modeling", "user modeling", "users"], "a": ["<b>Quantification<\/b>: users move between levels of expertise based on measures of their behaviour; help changes with the level.", "<b>Stereotypes<\/b>: users are classified into a stereotype (novice, expert, etc.) by their behaviour.", "<b>Overlay models<\/b>: the user's knowledge is compared with an expert model and differences guide the help.", "(Also adaptable systems, where the user sets their own p
